services:
  postgres:
    image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    environment:
      POSTGRES_USER: cff_sim
      POSTGRES_PASSWORD: cff_sim_only
      POSTGRES_DB: cff_sim
    ports:
      - "127.0.0.1:${CFF_SIM_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cff_sim -d cff_sim"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8080"
      DB_URL: postgresql://cff_sim:cff_sim_only@postgres:5432/cff_sim
      JWT_SECRET: local-simulation-secret-not-for-production
      CFF_REQUIRE_DB: "true"
      CFF_RUN_MIGRATIONS_ON_STARTUP: "true"
      CFF_REQUIRE_EMAIL_VERIFICATION: "false"
      CFF_ALLOW_SHARED_SECRET_AUTH: "false"
      ESPN_ROSTER_AUTO_ONCE: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:${CFF_SIM_FRONTEND_PORT:-13000},http://localhost:${CFF_SIM_FRONTEND_PORT:-13000}
    ports:
      - "127.0.0.1:${CFF_SIM_API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import json,urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)); raise SystemExit(0 if p.get('status')=='ok' and p.get('database')=='ok' else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${CFF_SIM_FRONTEND_PORT:-13000}:8080"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: cff-sim-network
