name: Stat ingestion lifecycle contracts

on:
  push:
    branches: [main, Test]
    paths:
      - "backend/CMakeLists.txt"
      - "backend/Dockerfile"
      - "backend/docker-entrypoint.sh"
      - "backend/src/stat_ingestion_lifecycle.h"
      - "backend/src/stat_ingestion_lifecycle.cpp"
      - "backend/src/stat_ingestion_hardening.cpp"
      - "backend/src/stat_ingestion_hardening_*.inc"
      - "backend/tests/stat_ingestion_lifecycle_tests.cpp"
      - "backend/tests/stat_ingestion_contract_tests.py"
      - "backend/db/migrations/019_stat_ingestion_reliability.sql"
      - "scripts/stat_ingestion_runtime_contract.py"
      - ".github/workflows/stat-ingestion-contracts.yml"
  pull_request:
    branches: [main, Test]
    paths:
      - "backend/CMakeLists.txt"
      - "backend/Dockerfile"
      - "backend/docker-entrypoint.sh"
      - "backend/src/stat_ingestion_lifecycle.h"
      - "backend/src/stat_ingestion_lifecycle.cpp"
      - "backend/src/stat_ingestion_hardening.cpp"
      - "backend/src/stat_ingestion_hardening_*.inc"
      - "backend/tests/stat_ingestion_lifecycle_tests.cpp"
      - "backend/tests/stat_ingestion_contract_tests.py"
      - "backend/db/migrations/019_stat_ingestion_reliability.sql"
      - "scripts/stat_ingestion_runtime_contract.py"
      - ".github/workflows/stat-ingestion-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stat-ingestion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused C++ dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjsoncpp-dev

      - name: Validate lifecycle sources
        run: |
          python -m py_compile \
            backend/tests/stat_ingestion_contract_tests.py \
            scripts/stat_ingestion_runtime_contract.py

      - name: Run source contracts
        run: python backend/tests/stat_ingestion_contract_tests.py

      - name: Compile and run stat ingestion lifecycle rules
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
            -I/usr/include/jsoncpp -Ibackend/src \
            backend/tests/stat_ingestion_lifecycle_tests.cpp \
            backend/src/stat_ingestion_lifecycle.cpp \
            -ljsoncpp -o /tmp/stat_ingestion_lifecycle_tests
          /tmp/stat_ingestion_lifecycle_tests

  postgres-runtime:
    name: PostgreSQL ownership, corrections, and recovery
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cff
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Validate runtime contract
        run: python -m py_compile scripts/stat_ingestion_runtime_contract.py scripts/test_smtp_server.py

      - name: Build production API image
        shell: bash
        run: |
          set -o pipefail
          docker build -f backend/Dockerfile -t college-ff-api-stat-ingestion . 2>&1 | tee /tmp/stat-ingestion-build.log

      - name: Apply production migrations
        run: |
          docker run --rm --network host \
            --entrypoint sh \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            college-ff-api-stat-ingestion \
            /srv/db/migrate.sh

      - name: Generate isolated contract values
        shell: bash
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -hex 32)"
          admin_token="$(openssl rand -hex 32)"
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_token"
          echo "CFF_STAT_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "CFF_STAT_ADMIN_TOKEN=$admin_token" >> "$GITHUB_ENV"
          echo "CFF_STAT_RUN_KEY=$run_key" >> "$GITHUB_ENV"

      - name: Start isolated SMTP catcher
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/cff-stat-mail.jsonl
          python scripts/test_smtp_server.py \
            --host 127.0.0.1 \
            --port 1025 \
            --output /tmp/cff-stat-mail.jsonl \
            > /tmp/cff-stat-smtp.log 2>&1 &
          echo $! > /tmp/cff-stat-smtp.pid
          python - <<'PY'
          import socket
          import time
          for _ in range(30):
              try:
                  with socket.create_connection(("127.0.0.1", 1025), timeout=1):
                      raise SystemExit(0)
              except OSError:
                  time.sleep(1)
          raise SystemExit("SMTP test server did not become ready")
          PY

      - name: Start production API
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name college-ff-api-stat-ingestion --network host \
            -e PORT=8080 \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            -e JWT_SECRET="$CFF_STAT_JWT_SECRET" \
            -e ALLOWED_ORIGINS=https://frontend.example.test \
            -e CFF_ADMIN_API_TOKEN="$CFF_STAT_ADMIN_TOKEN" \
            -e CFF_REQUIRE_DB=true \
            -e CFF_RUN_MIGRATIONS_ON_STARTUP=false \
            -e ESPN_ROSTER_AUTO_ONCE=false \
            -e CFF_ALLOW_SHARED_SECRET_AUTH=false \
            -e CFF_REQUIRE_EMAIL_VERIFICATION=false \
            -e CFF_EXPOSE_AUTH_TOKENS=false \
            -e CFF_LOG_AUTH_TOKENS=false \
            -e CFF_SECURITY_ENFORCE_PRODUCTION=true \
            -e CFF_TRUST_PROXY_HEADERS=false \
            -e CFF_FRONTEND_BASE_URL=https://frontend.example.test \
            -e CFF_EMAIL_PROVIDER=smtp \
            -e CFF_EMAIL_FROM='College Fantasy Stat Test <noreply@example.test>' \
            -e CFF_SMTP_HOST=127.0.0.1 \
            -e CFF_SMTP_PORT=1025 \
            -e CFF_SMTP_SECURITY=none \
            -e CFF_SMTP_USERNAME=test-user \
            -e CFF_SMTP_PASSWORD=test-password \
            -e CFF_MIN_PASSWORD_LENGTH=12 \
            college-ff-api-stat-ingestion

      - name: Run ownership, correction, retry, and recovery contracts
        shell: bash
        env:
          CFF_API_BASE_URL: http://127.0.0.1:8080
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/cff
          CFF_CONTRACT_ORIGIN: https://frontend.example.test
          CFF_ADMIN_API_TOKEN: ${{ env.CFF_STAT_ADMIN_TOKEN }}
        run: |
          set -o pipefail
          python scripts/stat_ingestion_runtime_contract.py 2>&1 | tee /tmp/stat-ingestion-runtime.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stat-ingestion-runtime-diagnostics
          path: |
            /tmp/stat-ingestion-build.log
            /tmp/stat-ingestion-runtime.log
            /tmp/cff-stat-mail.jsonl
            /tmp/cff-stat-smtp.log
          if-no-files-found: warn
          retention-days: 7

      - name: Backend logs
        if: always()
        run: docker logs college-ff-api-stat-ingestion || true

      - name: Stop containers
        if: always()
        run: |
          docker rm -f college-ff-api-stat-ingestion || true
          if test -f /tmp/cff-stat-smtp.pid; then
            kill "$(cat /tmp/cff-stat-smtp.pid)" || true
          fi
