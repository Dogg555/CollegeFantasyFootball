name: Bootstrap app config refactor

on:
  push:
    branches: [refactor/extract-app-config]
    paths:
      - "scripts/refactor_app_config.py"
      - ".github/workflows/bootstrap-app-config-refactor.yml"
  pull_request:
    branches: [Test]
    paths:
      - "scripts/refactor_app_config.py"
      - ".github/workflows/bootstrap-app-config-refactor.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-app-config
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact source transformation
        run: python scripts/refactor_app_config.py

      - name: Commit generated refactor and remove bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/refactor_app_config.py .github/workflows/bootstrap-app-config-refactor.yml
          git add \
            backend/src/main.cpp \
            backend/src/app_config.h \
            backend/src/app_config.cpp \
            backend/tests/app_config_tests.cpp \
            backend/CMakeLists.txt \
            .github/workflows/app-config-tests.yml
          git diff --cached --check
          git commit -m "Extract backend app configuration"
          git push origin HEAD:refactor/extract-app-config
