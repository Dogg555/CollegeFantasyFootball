name: Bootstrap operations route refactor

on:
  pull_request:
    branches: [Test]
    paths:
      - "scripts/refactor_operations_routes.py"
      - ".github/workflows/bootstrap-operations-routes.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-operations-routes
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact operations route transformation
        run: python scripts/refactor_operations_routes.py

      - name: Validate transformed sources
        run: |
          python -m py_compile \
            scripts/auth_contract_tests.py \
            backend/tests/operations_routes_boundary_tests.py
          python backend/tests/operations_routes_boundary_tests.py

      - name: Commit generated operations integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/main.cpp \
            backend/CMakeLists.txt \
            scripts/auth_contract_tests.py
          git diff --cached --check
          git commit -m "Extract operations and ingestion routes"
          git push origin HEAD:refactor/extract-operations-routes
