name: Bootstrap auth core integration fix

on:
  push:
    branches: [refactor/extract-auth-core]
    paths:
      - "scripts/fix_auth_core_admin_canonicalization.py"
      - ".github/workflows/bootstrap-auth-core-integration-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-auth-core
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact integration fix
        run: python scripts/fix_auth_core_admin_canonicalization.py

      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main.cpp
          git diff --cached --check
          git commit -m "Use auth core for admin email normalization"
          git push origin HEAD:refactor/extract-auth-core
