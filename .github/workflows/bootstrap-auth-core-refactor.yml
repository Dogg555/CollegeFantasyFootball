name: Bootstrap auth core refactor

on:
  push:
    branches: [refactor/extract-auth-core]
    paths:
      - "scripts/refactor_auth_core.py"
      - ".github/workflows/bootstrap-auth-core-refactor.yml"
  pull_request:
    branches: [Test]
    paths:
      - "scripts/refactor_auth_core.py"
      - ".github/workflows/bootstrap-auth-core-refactor.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-auth-core
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact source transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/refactor_auth_core.py")
          text = path.read_text(encoding="utf-8")
          old = '''    "    src/app_config.cpp\\n",
              "    src/app_config.cpp\\n    src/auth_core.cpp\\n",
              "add auth core production source",'''
          new = '''    "    src/main.cpp\\n    src/app_config.cpp\\n    src/email_delivery.cpp\\n",
              "    src/main.cpp\\n    src/app_config.cpp\\n    src/auth_core.cpp\\n    src/email_delivery.cpp\\n",
              "add auth core production source",'''
          if text.count(old) != 1:
              raise SystemExit("auth core CMake anchor patch did not match exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python scripts/refactor_auth_core.py

      - name: Commit generated auth core
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/main.cpp \
            backend/src/auth_core.h \
            backend/src/auth_core.cpp \
            backend/tests/auth_core_tests.cpp \
            backend/CMakeLists.txt
          git diff --cached --check
          git commit -m "Extract stateless authentication core"
          git push origin HEAD:refactor/extract-auth-core
