name: Bootstrap draft compile correction

on:
  pull_request:
    branches: [Test]
    paths:
      - ".github/workflows/bootstrap-draft-compile-fix.yml"

permissions:
  contents: write

jobs:
  correct-model-access:
    name: Correct draft settings model access
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Correct draft type member access
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/handlers/league_handler.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'leagueIt->second.league.draftType'
          new = 'leagueIt->second.league.draft.type'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one draft type model access, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit compile correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/handlers/league_handler.cpp
          git commit -m "Correct draft settings model access"
          git push
