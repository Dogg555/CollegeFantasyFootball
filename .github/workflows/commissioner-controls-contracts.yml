name: Commissioner controls contracts

on:
  push:
    branches: [main, Test]
    paths:
      - "backend/CMakeLists.txt"
      - "backend/Dockerfile"
      - "backend/docker-entrypoint.sh"
      - "backend/src/commissioner_controls.h"
      - "backend/src/commissioner_controls.cpp"
      - "backend/src/commissioner_routes.h"
      - "backend/src/commissioner_routes.cpp"
      - "backend/src/commissioner_routes_*.inc"
      - "backend/tests/commissioner_controls_tests.cpp"
      - "backend/db/migrations/022_commissioner_controls.sql"
      - "scripts/commissioner_controls_runtime_contract.py"
      - "scripts/trade_lifecycle_runtime_contract.py"
      - "scripts/test_smtp_server.py"
      - "frontend/config.js"
      - "frontend/commissioner-controls.js"
      - "frontend/tests/commissioner-controls.test.js"
      - ".github/workflows/commissioner-controls-contracts.yml"
  pull_request:
    branches: [main, Test]
    paths:
      - "backend/CMakeLists.txt"
      - "backend/Dockerfile"
      - "backend/docker-entrypoint.sh"
      - "backend/src/commissioner_controls.h"
      - "backend/src/commissioner_controls.cpp"
      - "backend/src/commissioner_routes.h"
      - "backend/src/commissioner_routes.cpp"
      - "backend/src/commissioner_routes_*.inc"
      - "backend/tests/commissioner_controls_tests.cpp"
      - "backend/db/migrations/022_commissioner_controls.sql"
      - "scripts/commissioner_controls_runtime_contract.py"
      - "scripts/trade_lifecycle_runtime_contract.py"
      - "scripts/test_smtp_server.py"
      - "frontend/config.js"
      - "frontend/commissioner-controls.js"
      - "frontend/tests/commissioner-controls.test.js"
      - ".github/workflows/commissioner-controls-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commissioner-controls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate focused sources
        run: |
          node --check frontend/config.js
          node --check frontend/commissioner-controls.js
          node --check frontend/tests/commissioner-controls.test.js
          python -m py_compile scripts/commissioner_controls_runtime_contract.py

      - name: Run browser contracts
        run: node frontend/tests/commissioner-controls.test.js

      - name: Compile and run commissioner rules
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
            -Ibackend/src \
            backend/tests/commissioner_controls_tests.cpp \
            backend/src/commissioner_controls.cpp \
            -o /tmp/commissioner_controls_tests
          /tmp/commissioner_controls_tests

      - name: Validate route and migration structure
        run: |
          grep -F 'commissioner/invitations' backend/src/commissioner_routes_registration.inc
          grep -F 'commissioner/members/{2}/{3}' backend/src/commissioner_routes_registration.inc
          grep -F 'protectedSettingsLocked' backend/src/commissioner_routes_support.inc
          grep -F 'enforce_league_competition_settings_lock' backend/db/migrations/022_commissioner_controls.sql
          grep -F 'enforce_league_member_transition' backend/db/migrations/022_commissioner_controls.sql
          grep -F 'commissioner-controls.js' frontend/config.js

  postgres-runtime:
    name: PostgreSQL commissioner lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cff
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GITHUB_HEAD_REF" "https://github.com/$GITHUB_REPOSITORY.git" .

      - name: Install runtime dependency
        run: python3 -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Build production API image
        run: docker build -f backend/Dockerfile -t college-ff-api-commissioner-contracts .

      - name: Apply production migrations
        run: |
          docker run --rm --network host \
            --entrypoint sh \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            college-ff-api-commissioner-contracts \
            /srv/db/migrate.sh

      - name: Generate isolated contract values
        shell: bash
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -hex 32)"
          admin_token="$(openssl rand -hex 32)"
          password="$(openssl rand -base64 24 | tr -d '\n' | tr '/+' 'Rr')-R4!"
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for value in "$jwt_secret" "$admin_token" "$password"; do
            echo "::add-mask::$value"
          done
          echo "CFF_COMMISSIONER_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "CFF_COMMISSIONER_ADMIN_TOKEN=$admin_token" >> "$GITHUB_ENV"
          echo "CFF_CONTRACT_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "CFF_TRADE_RUN_KEY=$run_key" >> "$GITHUB_ENV"

      - name: Start isolated SMTP catcher
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/cff-commissioner-mail.jsonl
          python3 scripts/test_smtp_server.py \
            --host 127.0.0.1 \
            --port 1025 \
            --output /tmp/cff-commissioner-mail.jsonl \
            > /tmp/cff-commissioner-smtp.log 2>&1 &
          echo $! > /tmp/cff-commissioner-smtp.pid
          python3 - <<'PY'
          import socket
          import time
          for _ in range(30):
              try:
                  with socket.create_connection(("127.0.0.1", 1025), timeout=1):
                      raise SystemExit(0)
              except OSError:
                  time.sleep(1)
          raise SystemExit("SMTP test server did not become ready")
          PY

      - name: Start production API
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name college-ff-api-commissioner-contracts --network host \
            -e PORT=8080 \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            -e JWT_SECRET="$CFF_COMMISSIONER_JWT_SECRET" \
            -e ALLOWED_ORIGINS=https://frontend.example.test \
            -e CFF_ADMIN_API_TOKEN="$CFF_COMMISSIONER_ADMIN_TOKEN" \
            -e CFF_REQUIRE_DB=true \
            -e CFF_RUN_MIGRATIONS_ON_STARTUP=false \
            -e ESPN_ROSTER_AUTO_ONCE=false \
            -e CFF_ALLOW_SHARED_SECRET_AUTH=false \
            -e CFF_REQUIRE_EMAIL_VERIFICATION=false \
            -e CFF_EXPOSE_AUTH_TOKENS=false \
            -e CFF_LOG_AUTH_TOKENS=false \
            -e CFF_SECURITY_ENFORCE_PRODUCTION=true \
            -e CFF_TRUST_PROXY_HEADERS=false \
            -e CFF_FRONTEND_BASE_URL=https://frontend.example.test \
            -e CFF_EMAIL_PROVIDER=smtp \
            -e CFF_EMAIL_FROM='College Fantasy Commissioner Test <noreply@example.test>' \
            -e CFF_SMTP_HOST=127.0.0.1 \
            -e CFF_SMTP_PORT=1025 \
            -e CFF_SMTP_SECURITY=none \
            -e CFF_SMTP_USERNAME=test-user \
            -e CFF_SMTP_PASSWORD=test-password \
            -e CFF_MIN_PASSWORD_LENGTH=12 \
            -e CFF_MAX_REQUEST_BODY_BYTES=262144 \
            -e CFF_AUTH_REQUEST_BODY_BYTES=8192 \
            -e CFF_AUTH_BURST_CLIENT_LIMIT=500 \
            -e CFF_SIGNUP_CLIENT_LIMIT=500 \
            -e CFF_SIGNUP_ACCOUNT_LIMIT=100 \
            -e CFF_SIGNUP_RATE_WINDOW_MINUTES=60 \
            college-ff-api-commissioner-contracts

      - name: Run commissioner lifecycle contract
        shell: bash
        env:
          CFF_API_BASE_URL: http://127.0.0.1:8080
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/cff
          CFF_CONTRACT_ORIGIN: https://frontend.example.test
        run: |
          set -o pipefail
          python3 scripts/commissioner_controls_runtime_contract.py 2>&1 | tee /tmp/commissioner-controls-runtime.log

      - name: Print runtime diagnostics
        if: always()
        shell: bash
        run: |
          for file in /tmp/commissioner-controls-runtime.log /tmp/cff-commissioner-mail.jsonl /tmp/cff-commissioner-smtp.log; do
            if test -f "$file"; then
              echo "::group::$file"
              cat "$file"
              echo "::endgroup::"
            fi
          done

      - name: Backend logs
        if: always()
        run: docker logs college-ff-api-commissioner-contracts || true

      - name: Stop containers
        if: always()
        run: |
          docker rm -f college-ff-api-commissioner-contracts || true
          if test -f /tmp/cff-commissioner-smtp.pid; then
            kill "$(cat /tmp/cff-commissioner-smtp.pid)" || true
          fi
