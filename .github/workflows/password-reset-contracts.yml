name: Password reset token contracts

on:
  push:
    branches: [main, Test]
    paths:
      - "backend/Dockerfile"
      - "backend/docker-entrypoint.sh"
      - "backend/src/auth_account_store.cpp"
      - "backend/src/auth_controller.cpp"
      - "backend/db/**"
      - "scripts/password_reset_contract_tests.py"
      - "scripts/test_smtp_server.py"
      - ".github/workflows/password-reset-contracts.yml"
  pull_request:
    branches: [main, Test]
    paths:
      - "backend/Dockerfile"
      - "backend/docker-entrypoint.sh"
      - "backend/src/auth_account_store.cpp"
      - "backend/src/auth_controller.cpp"
      - "backend/db/**"
      - "scripts/password_reset_contract_tests.py"
      - "scripts/test_smtp_server.py"
      - ".github/workflows/password-reset-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: password-reset-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reset-token-lifecycle:
    name: ${{ matrix.mode }} reset lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode:
          - verification-disabled
          - verification-required

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cff
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate focused contract sources
        run: |
          python -m py_compile \
            scripts/password_reset_contract_tests.py \
            scripts/test_smtp_server.py

      - name: Build production API image
        run: docker build -f backend/Dockerfile -t college-ff-password-reset-contracts .

      - name: Apply production migrations
        run: |
          docker run --rm --network host \
            --entrypoint sh \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            college-ff-password-reset-contracts \
            /srv/db/migrate.sh

      - name: Generate isolated test values
        shell: bash
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -hex 32)"
          password="$(openssl rand -base64 24 | tr -d '\n' | tr '/+' 'Aa')-A1!"
          new_password="$(openssl rand -base64 24 | tr -d '\n' | tr '/+' 'Bb')-B2!"
          email="password-reset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.mode }}@example.test"
          for value in "$jwt_secret" "$password" "$new_password"; do
            echo "::add-mask::$value"
          done
          echo "CFF_TEST_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "CFF_CONTRACT_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "CFF_CONTRACT_NEW_PASSWORD=$new_password" >> "$GITHUB_ENV"
          echo "CFF_CONTRACT_EMAIL=$email" >> "$GITHUB_ENV"

      - name: Start isolated SMTP catcher
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/cff-password-reset-mail.jsonl
          python scripts/test_smtp_server.py \
            --host 127.0.0.1 \
            --port 1025 \
            --output /tmp/cff-password-reset-mail.jsonl \
            > /tmp/cff-password-reset-smtp.log 2>&1 &
          echo $! > /tmp/cff-password-reset-smtp.pid
          python - <<'PY'
          import socket
          import time

          for _ in range(30):
              try:
                  with socket.create_connection(("127.0.0.1", 1025), timeout=1):
                      raise SystemExit(0)
              except OSError:
                  time.sleep(1)
          raise SystemExit("SMTP test server did not become ready")
          PY

      - name: Start production API
        shell: bash
        env:
          VERIFICATION_REQUIRED: ${{ matrix.mode == 'verification-required' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          docker run -d --name college-ff-password-reset-contracts --network host \
            -e PORT=8080 \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            -e JWT_SECRET="$CFF_TEST_JWT_SECRET" \
            -e ALLOWED_ORIGINS=https://frontend.example.test \
            -e CFF_REQUIRE_DB=true \
            -e CFF_RUN_MIGRATIONS_ON_STARTUP=false \
            -e ESPN_ROSTER_AUTO_ONCE=false \
            -e CFF_ALLOW_SHARED_SECRET_AUTH=false \
            -e CFF_REQUIRE_EMAIL_VERIFICATION="$VERIFICATION_REQUIRED" \
            -e CFF_EXPOSE_AUTH_TOKENS=false \
            -e CFF_LOG_AUTH_TOKENS=false \
            -e CFF_SECURITY_ENFORCE_PRODUCTION=true \
            -e CFF_TRUST_PROXY_HEADERS=false \
            -e CFF_FRONTEND_BASE_URL=https://frontend.example.test \
            -e CFF_EMAIL_PROVIDER=smtp \
            -e CFF_EMAIL_FROM='College Fantasy Test <noreply@example.test>' \
            -e CFF_SMTP_HOST=127.0.0.1 \
            -e CFF_SMTP_PORT=1025 \
            -e CFF_SMTP_SECURITY=none \
            -e CFF_SMTP_USERNAME=test-user \
            -e CFF_SMTP_PASSWORD=test-password \
            -e CFF_MIN_PASSWORD_LENGTH=12 \
            -e CFF_MAX_REQUEST_BODY_BYTES=262144 \
            -e CFF_AUTH_REQUEST_BODY_BYTES=8192 \
            -e CFF_AUTH_BURST_CLIENT_LIMIT=500 \
            -e CFF_SIGNUP_CLIENT_LIMIT=500 \
            -e CFF_SIGNUP_ACCOUNT_LIMIT=100 \
            college-ff-password-reset-contracts

      - name: Run reset-token lifecycle contracts
        shell: bash
        env:
          CFF_API_BASE_URL: http://127.0.0.1:8080
          CFF_AUTH_CONTRACT_MODE: ${{ matrix.mode }}
          CFF_CONTRACT_ORIGIN: https://frontend.example.test
          CFF_CONTRACT_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/cff
          CFF_CONTRACT_MAIL_LOG: /tmp/cff-password-reset-mail.jsonl
        run: |
          set -o pipefail
          python scripts/password_reset_contract_tests.py 2>&1 | tee /tmp/password-reset-contract-result.log

      - name: Retain reset diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: password-reset-${{ matrix.mode }}-diagnostics
          path: |
            /tmp/password-reset-contract-result.log
            /tmp/cff-password-reset-mail.jsonl
            /tmp/cff-password-reset-smtp.log
          if-no-files-found: warn
          retention-days: 7

      - name: Backend logs
        if: always()
        run: docker logs college-ff-password-reset-contracts || true
