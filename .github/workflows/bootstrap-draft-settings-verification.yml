name: Bootstrap draft settings verification

on:
  pull_request:
    branches: [Test]
    paths:
      - ".github/workflows/bootstrap-draft-settings-verification.yml"

permissions:
  contents: write

jobs:
  verify-lobby-fields:
    name: Add lobby fields to verified settings
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Include lobby access in settings verification
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/league-beta-stability.js')
          text = path.read_text(encoding='utf-8')
          old = '''      'scoring',
                'draftDate',
                'notes',
          '''.replace('        ', '')
          new = '''      'scoring',
                'draftDate',
                'draftLobbyOpen',
                'draftLobbyStartedAt',
                'notes',
          '''.replace('        ', '')
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'settings field anchor count: {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate verified settings client
        run: |
          node --check frontend/league-beta-stability.js
          git diff --check

      - name: Commit verified lobby fields
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/league-beta-stability.js
          git commit -m "Verify persisted draft lobby settings"
          git push
