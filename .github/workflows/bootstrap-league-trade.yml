name: Bootstrap league trade extraction

on:
  pull_request:
    branches: [Test]
    paths:
      - "scripts/bootstrap_extract_league_trade.py"
      - ".github/workflows/bootstrap-league-trade.yml"
      - "backend/src/league_trade.h"
      - "backend/src/league_trade.cpp"
      - "backend/tests/league_trade_tests.cpp"
      - "backend/tests/league_trade_boundary_tests.py"

permissions:
  contents: write

jobs:
  apply-extraction:
    name: Apply isolated trade policy extraction
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JsonCpp development library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjsoncpp-dev pkg-config

      - name: Apply guarded source transformation
        run: python scripts/bootstrap_extract_league_trade.py

      - name: Verify generated ownership boundary
        run: python backend/tests/league_trade_boundary_tests.py

      - name: Compile deterministic trade policy tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ibackend/src \
            backend/src/json_utils.cpp \
            backend/src/league_trade.cpp \
            backend/tests/league_trade_tests.cpp \
            $(pkg-config --cflags --libs jsoncpp) \
            -o /tmp/league_trade_tests

      - name: Run trade policy tests
        run: /tmp/league_trade_tests

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit generated integration
        run: |
          if git diff --quiet -- backend/src/handlers/league_handler.cpp backend/CMakeLists.txt; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/handlers/league_handler.cpp backend/CMakeLists.txt
          git commit -m "Integrate league trade policy module"
          git push
