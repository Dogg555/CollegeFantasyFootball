name: Bootstrap draft lobby multiplayer fix

on:
  pull_request:
    branches: [Test]
    paths:
      - "scripts/bootstrap_fix_draft_lobby_multiplayer.py"
      - ".github/workflows/bootstrap-draft-lobby-multiplayer.yml"
      - "backend/tests/draft_lobby_multiplayer_boundary_tests.py"
      - ".github/workflows/draft-lobby-multiplayer.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    name: Apply guarded multiplayer draft fix
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply guarded source transformation
        run: python scripts/bootstrap_fix_draft_lobby_multiplayer.py

      - name: Verify multiplayer draft ownership boundary
        run: python backend/tests/draft_lobby_multiplayer_boundary_tests.py

      - name: Validate frontend syntax and integration source
        run: |
          node --check frontend/state.js
          node --check frontend/draft.js
          node --check frontend/league.js
          python -m py_compile scripts/draft_lobby_multiplayer_tests.py

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit generated integration
        run: |
          if git diff --quiet -- \
            backend/src/handlers/league_handler.cpp \
            backend/src/handlers/league_handler.h \
            backend/src/league_routes.cpp \
            frontend/state.js \
            frontend/draft.js \
            frontend/draft.html \
            frontend/league.js \
            frontend/league.html; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/handlers/league_handler.cpp \
            backend/src/handlers/league_handler.h \
            backend/src/league_routes.cpp \
            frontend/state.js \
            frontend/draft.js \
            frontend/draft.html \
            frontend/league.js \
            frontend/league.html
          git commit -m "Fix multiplayer draft lobby and start flow"
          git push
