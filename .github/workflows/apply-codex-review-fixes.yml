name: Apply Codex review fixes
# Existing workflow retrigger for the one-time implementation run.

on:
  push:
    branches: [Test]
    paths:
      - ".github/workflows/apply-codex-review-fixes.yml"

permissions:
  contents: write

concurrency:
  group: apply-codex-review-fixes
  cancel-in-progress: false

jobs:
  apply-fixes:
    if: github.event.head_commit.message == 'Run Codex review fix automation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply reviewed code and workflow fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          ROOT = Path.cwd()

          def replace_once(relative_path: str, old: str, new: str) -> None:
              path = ROOT / relative_path
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one match in {relative_path}, found {count}: {old[:100]!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def add_paths_to_event_blocks(path: Path, additions: list[str]) -> bool:
              lines = path.read_text(encoding="utf-8").splitlines()
              changed = False
              index = 0
              while index < len(lines):
                  if lines[index] != "    paths:":
                      index += 1
                      continue
                  block_end = index + 1
                  while block_end < len(lines):
                      line = lines[block_end]
                      if line and not line.startswith("      "):
                          break
                      block_end += 1
                  existing = set(lines[index + 1:block_end])
                  missing = [f'      - "{item}"' for item in additions if f'      - "{item}"' not in existing]
                  if missing:
                      lines[index + 1:index + 1] = missing
                      changed = True
                      index += len(missing)
                  index = block_end
              if changed:
                  path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              return changed

          # PR #140: keep the two-second draft poll limited to draft state.
          replace_once(
              "frontend/draft.js",
              """async function refreshDraftFromApi() {
            if (!getAuthState()?.token) return;
            if (draftRefreshInFlight) return;
            draftRefreshInFlight = true;
            try {
              await syncLeaguesFromApi();
              await syncActiveLeagueCollectionsFromApi();
              await syncDraftFromApi();
            } catch {
              // Keep the last authoritative draft snapshot visible during an outage.
            } finally {
              draftRefreshInFlight = false;
            }
          }
          """,
              """async function refreshDraftFromApi() {
            if (!getAuthState()?.token) return;
            if (draftRefreshInFlight) return;
            draftRefreshInFlight = true;
            try {
              await syncDraftFromApi();
            } catch {
              // Keep the last authoritative draft snapshot visible during an outage.
            } finally {
              draftRefreshInFlight = false;
            }
          }

          async function refreshDraftContextFromApi() {
            if (!getAuthState()?.token) return;
            try {
              await syncLeaguesFromApi();
              await syncActiveLeagueCollectionsFromApi();
            } catch {
              // Keep the current league shell visible while draft state continues polling.
            }
            await refreshDraftFromApi();
          }
          """,
          )
          replace_once(
              "frontend/draft.js",
              """refreshDraftBtn?.addEventListener('click', async () => {
            await refreshDraftFromApi();
            renderAll();
          });
          """,
              """refreshDraftBtn?.addEventListener('click', async () => {
            await refreshDraftContextFromApi();
            renderAll();
          });
          """,
          )
          replace_once(
              "frontend/draft.js",
              """  await refreshDraftLeagueShell();
            renderAll();
            await refreshDraftFromApi();
            renderAll();
          """,
              """  await refreshDraftLeagueShell();
            renderAll();
            await refreshDraftContextFromApi();
            renderAll();
          """,
          )

          # PR #142: make page-level validation share and await auth recovery.
          replace_once(
              "frontend/alpha-ui.js",
              """  async function guardPrivatePage() {
            if (!isPrivatePage) return true;

            try {
              await root.CFFAuthSessionSync?.recover();
            } catch {
              // Continue with the current tab's session when cross-tab recovery is unavailable.
            }

            const auth = typeof root.getAuthState === 'function' ? root.getAuthState() : null;
          """,
              """  let privatePageRecovery = null;

          function recoverPrivatePageSession() {
            if (!isPrivatePage) return Promise.resolve(null);
            if (!privatePageRecovery) {
              privatePageRecovery = Promise.resolve()
                .then(() => root.CFFAuthSessionSync?.recover())
                .catch(() => null);
            }
            return privatePageRecovery;
          }

          if (isPrivatePage && typeof root.validateAuthSession === 'function') {
            const originalValidateAuthSession = root.validateAuthSession;
            root.validateAuthSession = async function validateAuthAfterPrivatePageRecovery() {
              await recoverPrivatePageSession();
              return originalValidateAuthSession();
            };
          }

          async function guardPrivatePage() {
            if (!isPrivatePage) return true;

            await recoverPrivatePageSession();

            const auth = typeof root.getAuthState === 'function' ? root.getAuthState() : null;
          """,
          )
          replace_once(
              "frontend/alpha-ui.js",
              """  const privateGuard = guardPrivatePage();

            function setupBranding() {
          """,
              """  const privateGuard = guardPrivatePage();
            root.CFFPrivatePageGuard = privateGuard;

            function setupBranding() {
          """,
          )

          workflows = list((ROOT / ".github/workflows").glob("*.yml"))

          # PR #135: every workflow owning a bootstrap-aware boundary test must
          # run when the bootstrap implementation or interface changes.
          bootstrap_tests = []
          for test in (ROOT / "backend/tests").glob("*.py"):
              if "application_bootstrap.cpp" in test.read_text(encoding="utf-8"):
                  bootstrap_tests.append(test)

          matched_workflows = set()
          for test in bootstrap_tests:
              relative_test = test.relative_to(ROOT).as_posix()
              for workflow in workflows:
                  content = workflow.read_text(encoding="utf-8")
                  if relative_test in content:
                      add_paths_to_event_blocks(
                          workflow,
                          [
                              "backend/src/application_bootstrap.h",
                              "backend/src/application_bootstrap.cpp",
                          ],
                      )
                      matched_workflows.add(workflow.name)

          if not matched_workflows:
              raise SystemExit("no bootstrap-aware workflows were discovered")

          # PR #138: waiver policy compiles and depends on the JSON helpers.
          waiver_workflow = ROOT / ".github/workflows/league-waiver-contracts.yml"
          add_paths_to_event_blocks(
              waiver_workflow,
              ["backend/src/json_utils.h", "backend/src/json_utils.cpp"],
          )

          # PR #140: draft ordering/start eligibility depend on league_schedule.
          draft_workflow = ROOT / ".github/workflows/draft-lobby-multiplayer.yml"
          draft_text = draft_workflow.read_text(encoding="utf-8")
          if "  push:\n" not in draft_text:
              pull_start = draft_text.index("  pull_request:\n")
              dispatch_start = draft_text.index("  workflow_dispatch:", pull_start)
              pull_block = draft_text[pull_start:dispatch_start]
              push_block = pull_block.replace("  pull_request:\n", "  push:\n", 1)
              draft_text = draft_text[:pull_start] + push_block + draft_text[pull_start:]
              draft_workflow.write_text(draft_text, encoding="utf-8")
          add_paths_to_event_blocks(
              draft_workflow,
              ["backend/src/league_schedule.h", "backend/src/league_schedule.cpp"],
          )

          # Verify the expected structural outcomes before tests run.
          draft = (ROOT / "frontend/draft.js").read_text(encoding="utf-8")
          poll_body = draft[draft.index("async function refreshDraftFromApi()"):draft.index("function startDraftSyncPolling()")]
          if "syncActiveLeagueCollectionsFromApi" in poll_body or "syncLeaguesFromApi" in poll_body:
              raise SystemExit("draft poll still contains broad league synchronization")
          if "refreshDraftContextFromApi" not in draft:
              raise SystemExit("manual/initial full draft context refresh is missing")

          alpha = (ROOT / "frontend/alpha-ui.js").read_text(encoding="utf-8")
          for expected in (
              "function recoverPrivatePageSession()",
              "validateAuthAfterPrivatePageRecovery",
              "root.CFFPrivatePageGuard = privateGuard",
          ):
              if expected not in alpha:
                  raise SystemExit(f"auth recovery integration missing: {expected}")

          print("bootstrap-aware workflows:", ", ".join(sorted(matched_workflows)))

      - name: Validate JavaScript and structural contracts
        run: |
          node --check frontend/draft.js
          node --check frontend/alpha-ui.js
          node --check frontend/auth-session-sync.js
          node --check frontend/league.js
          python backend/tests/private_page_auth_recovery_tests.py
          python backend/tests/draft_lobby_multiplayer_boundary_tests.py
          python backend/tests/draft_room_active_member_entry_tests.py
          python backend/tests/league_waiver_boundary_tests.py
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root = Path.cwd()
          tests = [
              path for path in (root / "backend/tests").glob("*.py")
              if "application_bootstrap.cpp" in path.read_text(encoding="utf-8")
          ]
          if not tests:
              raise SystemExit("no bootstrap-aware tests discovered")
          for test in sorted(tests):
              print(f"running {test.relative_to(root)}")
              subprocess.run([sys.executable, str(test)], check=True)
          PY

      - name: Commit fixes to Test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/draft.js frontend/alpha-ui.js .github/workflows
          git diff --cached --check
          git commit -m "Implement Codex review fixes"
          git push origin HEAD:Test
