name: Staging page incident smoke

on:
  pull_request:
    branches:
      - Test
    paths:
      - scripts/staging_private_page_smoke.py
      - .github/workflows/staging-page-incident.yml
      - frontend/config.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-page-incident-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-pages:
    name: Players, league, and draft staging smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium smoke dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Exercise deployed staging pages
        run: python scripts/staging_private_page_smoke.py
      - name: Upload incident evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-page-incident-${{ github.run_id }}
          path: staging-incident-artifacts
          if-no-files-found: warn
          retention-days: 7
