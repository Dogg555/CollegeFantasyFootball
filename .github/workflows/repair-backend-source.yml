name: One-time backend source repair

on:
  push:
    branches:
      - agent/restore-full-backend-smoke

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[backend-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-full-backend-smoke
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow source repairs
        run: python .github/repair_backend_sources.py
      - name: Commit repaired sources and remove helper
        shell: bash
        run: |
          rm -f .github/repair_backend_sources.py .github/workflows/repair-backend-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main.cpp backend/src/handlers/league_handler.cpp backend/src/json_utils.h \
                  .github/repair_backend_sources.py .github/workflows/repair-backend-source.yml
          git commit -m "fix: repair restored backend sources [backend-repair]"
          git push origin HEAD:agent/restore-full-backend-smoke
