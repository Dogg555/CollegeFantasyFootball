name: Bootstrap auth account store refactor

on:
  pull_request:
    branches: [Test]
    paths:
      - "scripts/refactor_auth_account_store.py"
      - ".github/workflows/bootstrap-auth-account-store.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-auth-account-store
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact source transformation
        run: python scripts/refactor_auth_account_store.py

      - name: Commit generated account store
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/main.cpp \
            backend/src/auth_account_store.h \
            backend/src/auth_account_store.cpp \
            backend/tests/auth_account_store_tests.cpp \
            backend/CMakeLists.txt
          git diff --cached --check
          git commit -m "Extract authentication account store"
          git push origin HEAD:refactor/extract-auth-account-store
