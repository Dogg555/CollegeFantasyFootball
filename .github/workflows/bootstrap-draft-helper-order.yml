name: Bootstrap draft helper ordering fix

on:
  pull_request:
    branches: [Test]
    paths:
      - ".github/workflows/bootstrap-draft-helper-order.yml"

permissions:
  contents: write

jobs:
  correct-helper-order:
    name: Correct draft helper declaration order
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Add validator declaration and use active-member count
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/handlers/league_handler.cpp')
          text = path.read_text(encoding='utf-8')

          alias_anchor = '''using PgConnPtr = std::unique_ptr<PGconn, PgConnDeleter>;
          using PgResultPtr = std::unique_ptr<PGresult, PgResultDeleter>;
          '''.replace('          ', '')
          declaration = '''
          bool draftOrderMatchesMembers(PGconn *conn,
                                        const std::string &leagueId,
                                        const Json::Value &draftOrder);
          '''.replace('          ', '')
          if declaration.strip() not in text[:text.find('bool draftOrderMatchesMembers(')]:
              if text.count(alias_anchor) != 1:
                  raise SystemExit('PostgreSQL alias declaration anchor is not unique')
              text = text.replace(alias_anchor, alias_anchor + declaration, 1)

          old_guard = '''    if (order.size() < 2 || !draftOrderMatchesMembers(conn.get(), leagueId, order)) return std::nullopt;
          '''.replace('          ', '')
          new_guard = '''    if (activeMemberCountForLeague(conn.get(), leagueId) < 2
              || order.size() < 2
              || !draftOrderMatchesMembers(conn.get(), leagueId, order)) return std::nullopt;
          '''.replace('          ', '')
          if new_guard not in text:
              if text.count(old_guard) != 1:
                  raise SystemExit(f'draft start guard anchor count: {text.count(old_guard)}')
              text = text.replace(old_guard, new_guard, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit helper correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/handlers/league_handler.cpp
          git commit -m "Correct draft helper declaration order"
          git push
