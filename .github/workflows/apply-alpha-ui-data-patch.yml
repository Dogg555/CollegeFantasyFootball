name: Apply Alpha UI and data patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/alpha-ui-data-testing'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alpha-ui-data-testing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_alpha_ui_data_patch.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          filtered = []
          for line in lines:
              if 'replace_all("docs/alpha-release-runbook.md", "Monday", "Tuesday")' in line:
                  continue
              if 'replace_once("frontend/league.html"' in line and 'data-league-panel="overview"' in line:
                  continue
              filtered.append(line)
          path.write_text('\n'.join(filtered) + '\n', encoding='utf-8')
          PY
          python scripts/apply_alpha_ui_data_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/league.html')
          content = path.read_text(encoding='utf-8')
          if 'class="layout league-dashboard"' not in content:
              needle = '  <main class="layout" style="max-width: 1080px">'
              position = content.rfind(needle)
              if position < 0:
                  raise SystemExit('Unable to locate the league dashboard layout')
              content = content[:position] + '  <main class="layout league-dashboard" style="max-width: 1080px">' + content[position + len(needle):]
              path.write_text(content, encoding='utf-8')
          PY
      - name: Validate generated changes
        run: |
          python -m py_compile scripts/alpha_ui_contract_tests.py scripts/public_data_meta_tests.py
          node --check frontend/alpha-ui.js
          node --check frontend/players.js
          node --check frontend/scoreboard.js
          node scripts/scoreboard_ui_tests.js
          python scripts/alpha_ui_contract_tests.py
          git diff --check
      - name: Commit generated source changes
        run: |
          git checkout HEAD -- \
            .github/workflows/ci.yml \
            .github/workflows/alpha-readiness.yml \
            .github/workflows/render-validation.yml
          rm scripts/apply_alpha_ui_data_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve Alpha UI data and test coverage"
          git push origin HEAD:agent/alpha-ui-data-testing
