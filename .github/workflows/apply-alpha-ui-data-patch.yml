name: Apply Alpha UI and data patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/alpha-ui-data-testing'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alpha-ui-data-testing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded source patch
        run: |
          sed -i '/replace_all("docs\/alpha-release-runbook.md", "Monday", "Tuesday")/d' scripts/apply_alpha_ui_data_patch.py
          sed -i '/replace_once("frontend\/league.html", '\''  <main class=\\"layout\\" style=\\"max-width: 1080px\\">\\n    <section class=\\"card card--accent\\" data-league-panel=\\"overview\\">'\''/d' scripts/apply_alpha_ui_data_patch.py
          python scripts/apply_alpha_ui_data_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/league.html')
          content = path.read_text(encoding='utf-8')
          needle = '  <main class="layout" style="max-width: 1080px">'
          first = content.find(needle)
          second = content.find(needle, first + len(needle))
          if first < 0 or second < 0:
              raise SystemExit('Unable to locate the second league main layout')
          content = content[:second] + '  <main class="layout league-dashboard" style="max-width: 1080px">' + content[second + len(needle):]
          path.write_text(content, encoding='utf-8')
          PY
      - name: Validate generated changes
        run: |
          python -m py_compile scripts/alpha_ui_contract_tests.py scripts/public_data_meta_tests.py
          node --check frontend/alpha-ui.js
          node --check frontend/players.js
          node --check frontend/scoreboard.js
          node scripts/scoreboard_ui_tests.js
          python scripts/alpha_ui_contract_tests.py
          git diff --check
      - name: Commit generated source changes
        run: |
          rm scripts/apply_alpha_ui_data_patch.py
          rm .github/workflows/apply-alpha-ui-data-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve Alpha UI data and test coverage"
          git push origin HEAD:agent/alpha-ui-data-testing
