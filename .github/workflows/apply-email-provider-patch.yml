name: Apply email provider integration

on:
  push:
    branches: [agent/email-provider-abstraction]
    paths:
      - scripts/apply_email_provider_patch.py
      - .github/workflows/apply-email-provider-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/email-provider-abstraction
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded integration patch
        run: python scripts/apply_email_provider_patch.py
      - name: Validate generated changes
        run: |
          python -m py_compile scripts/apply_email_provider_patch.py
          git diff --check
          grep -F '#include "email_delivery.h"' backend/src/main.cpp
          grep -F 'src/email_delivery.cpp' backend/CMakeLists.txt
          grep -F 'CURL::libcurl' backend/CMakeLists.txt
      - name: Commit source integration
        run: |
          rm scripts/apply_email_provider_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate provider-agnostic email delivery"
          git push origin HEAD:agent/email-provider-abstraction
