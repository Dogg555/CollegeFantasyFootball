name: Apply open signup security patch

on:
  push:
    branches: [agent/security-open-signup]
    paths:
      - scripts/.security_patch_v2_*.b64
      - .github/workflows/apply-open-signup-security-patch.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/.security_patch_v2_*.b64
      - .github/workflows/apply-open-signup-security-patch.yml

permissions:
  contents: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-open-signup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct guarded patch
        run: |
          cat scripts/.security_patch_v2_*.b64 | base64 --decode > scripts/apply_open_signup_security_patch.py
          echo '3b1f0f52b4bb5fc53536ea1ba09ebbb276504f57ad9f71307a186f6fca423e14  scripts/apply_open_signup_security_patch.py' | sha256sum --check --strict
          python -m py_compile scripts/apply_open_signup_security_patch.py
      - name: Apply guarded source patch
        run: python scripts/apply_open_signup_security_patch.py
      - name: Validate generated source syntax
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python -m py_compile scripts/*.py
          for file in frontend/*.js; do node --check "$file"; done
          python - <<'PY'
          import yaml
          for path in ['render.yaml', '.github/workflows/ci.yml', '.github/workflows/security-hardening.yml']:
              with open(path, encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          PY
      - name: Remove encoded bootstrap chunks
        run: rm -f scripts/.security_patch_*.b64
      - name: Package validated source changes
        run: |
          mkdir -p /tmp/security-patch-output
          git diff --name-only --diff-filter=ACM -z | tar --null -T - -czf /tmp/security-patch-output/files.tar.gz
          git diff --name-only --diff-filter=D > /tmp/security-patch-output/deletions.txt
          git diff --stat > /tmp/security-patch-output/stat.txt
          git diff --check
      - name: Upload validated source changes
        uses: actions/upload-artifact@v4
        with:
          name: open-signup-security-patch
          path: /tmp/security-patch-output
          retention-days: 1
          if-no-files-found: error
