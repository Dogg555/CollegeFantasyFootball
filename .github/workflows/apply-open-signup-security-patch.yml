name: Apply open signup security patch

on:
  push:
    branches: [agent/security-open-signup]
    paths:
      - scripts/.security_patch_*.b64
      - .github/workflows/apply-open-signup-security-patch.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/.security_patch_*.b64
      - .github/workflows/apply-open-signup-security-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-open-signup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct guarded patch
        run: |
          cat scripts/.security_patch_*.b64 | base64 --decode > scripts/apply_open_signup_security_patch.py
          python -m py_compile scripts/apply_open_signup_security_patch.py
      - name: Apply guarded source patch
        run: python scripts/apply_open_signup_security_patch.py
      - name: Validate generated source syntax
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python -m py_compile scripts/*.py
          for file in frontend/*.js; do node --check "$file"; done
          python - <<'PY'
          import yaml
          for path in ['render.yaml', '.github/workflows/ci.yml', '.github/workflows/security-hardening.yml']:
              with open(path, encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          PY
      - name: Remove encoded bootstrap chunks
        run: rm -f scripts/.security_patch_*.b64
      - name: Commit patched sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden open signup identity and authorization"
          git push origin HEAD:agent/security-open-signup
