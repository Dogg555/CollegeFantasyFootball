name: Authenticated page states

on:
  push:
    branches: [main, Test]
    paths:
      - "frontend/alpha-ui.js"
      - "frontend/authenticated-states.css"
      - "frontend/tests/authenticated-states.test.js"
      - "backend/tests/authenticated_page_state_contract_tests.py"
      - ".github/workflows/authenticated-page-states.yml"
  pull_request:
    branches: [main, Test]
    paths:
      - "frontend/alpha-ui.js"
      - "frontend/authenticated-states.css"
      - "frontend/tests/authenticated-states.test.js"
      - "backend/tests/authenticated_page_state_contract_tests.py"
      - ".github/workflows/authenticated-page-states.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticated-page-states-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate state sources
        run: |
          node --check frontend/alpha-ui.js
          node --check frontend/tests/authenticated-states.test.js
          python -m py_compile backend/tests/authenticated_page_state_contract_tests.py

      - name: Run authenticated state contracts
        run: |
          node frontend/tests/authenticated-states.test.js
          python backend/tests/authenticated_page_state_contract_tests.py
