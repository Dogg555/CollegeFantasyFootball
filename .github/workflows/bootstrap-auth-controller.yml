name: Bootstrap auth controller refactor

on:
  pull_request:
    branches: [Test]
    paths:
      - "scripts/refactor_auth_controller.py"
      - ".github/workflows/bootstrap-auth-controller.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-auth-controller
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact controller transformation
        run: python scripts/refactor_auth_controller.py
      - name: Commit generated controller
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/main.cpp \
            backend/src/auth_controller.h \
            backend/src/auth_controller.cpp \
            backend/tests/auth_controller_boundary_tests.py \
            backend/CMakeLists.txt
          git diff --cached --check
          git commit -m "Extract authentication HTTP controller"
          git push origin HEAD:refactor/extract-auth-controller
