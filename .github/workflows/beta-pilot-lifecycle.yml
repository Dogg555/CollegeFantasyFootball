name: Exact-commit beta pilot lifecycle

on:
  push:
    branches:
      - Test
    paths:
      - "backend/**"
      - "scripts/beta_pilot_runtime_contract.py"
      - "backend/tests/beta_pilot_contract_tests.py"
      - ".github/workflows/beta-pilot-lifecycle.yml"
  pull_request:
    branches:
      - Test
    paths:
      - "backend/**"
      - "scripts/beta_pilot_runtime_contract.py"
      - "backend/tests/beta_pilot_contract_tests.py"
      - ".github/workflows/beta-pilot-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-pilot:
    name: Four-manager production pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cff
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CFF_API_BASE_URL: http://127.0.0.1:8080
      DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/cff
      CFF_CONTRACT_ORIGIN: https://frontend.example.test
      CFF_BETA_PILOT_REPORT: /tmp/beta-pilot-runtime.json

    steps:
      - name: Fetch exact commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$EXPECTED_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "Expected head: $EXPECTED_HEAD_SHA"
          echo "Checked-out head: $actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Install runtime dependency
        run: python3 -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Validate pilot sources
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/beta_pilot_runtime_contract.py \
            backend/tests/beta_pilot_contract_tests.py \
            scripts/test_smtp_server.py
          python3 backend/tests/beta_pilot_contract_tests.py

      - name: Build production API image
        run: docker build -f backend/Dockerfile -t college-ff-api-beta-pilot .

      - name: Apply production migrations
        run: |
          docker run --rm --network host \
            --entrypoint sh \
            -e DB_URL="$DB_URL" \
            college-ff-api-beta-pilot \
            /srv/db/migrate.sh

      - name: Generate isolated pilot values
        shell: bash
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -hex 32)"
          admin_token="$(openssl rand -hex 32)"
          password="$(openssl rand -base64 24 | tr -d '\n' | tr '/+' 'Dd')-P7!"
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for value in "$jwt_secret" "$admin_token" "$password"; do
            echo "::add-mask::$value"
          done
          echo "CFF_BETA_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "CFF_BETA_ADMIN_TOKEN=$admin_token" >> "$GITHUB_ENV"
          echo "CFF_CONTRACT_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "CFF_BETA_PILOT_RUN_KEY=$run_key" >> "$GITHUB_ENV"

      - name: Start isolated SMTP catcher
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/cff-beta-pilot-mail.jsonl
          python3 scripts/test_smtp_server.py \
            --host 127.0.0.1 \
            --port 1025 \
            --output /tmp/cff-beta-pilot-mail.jsonl \
            > /tmp/cff-beta-pilot-smtp.log 2>&1 &
          echo $! > /tmp/cff-beta-pilot-smtp.pid
          python3 - <<'PY'
          import socket
          import time

          for _ in range(30):
              try:
                  with socket.create_connection(("127.0.0.1", 1025), timeout=1):
                      raise SystemExit(0)
              except OSError:
                  time.sleep(1)
          raise SystemExit("SMTP catcher did not become ready")
          PY

      - name: Start production API
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name college-ff-api-beta-pilot --network host \
            -e PORT=8080 \
            -e DB_URL="$DB_URL" \
            -e JWT_SECRET="$CFF_BETA_JWT_SECRET" \
            -e ALLOWED_ORIGINS=https://frontend.example.test \
            -e CFF_ADMIN_API_TOKEN="$CFF_BETA_ADMIN_TOKEN" \
            -e CFF_REQUIRE_DB=true \
            -e CFF_RUN_MIGRATIONS_ON_STARTUP=false \
            -e ESPN_ROSTER_AUTO_ONCE=false \
            -e CFF_ALLOW_SHARED_SECRET_AUTH=false \
            -e CFF_REQUIRE_EMAIL_VERIFICATION=false \
            -e CFF_EXPOSE_AUTH_TOKENS=false \
            -e CFF_LOG_AUTH_TOKENS=false \
            -e CFF_SECURITY_ENFORCE_PRODUCTION=true \
            -e CFF_TRUST_PROXY_HEADERS=false \
            -e CFF_FRONTEND_BASE_URL=https://frontend.example.test \
            -e CFF_EMAIL_PROVIDER=smtp \
            -e CFF_EMAIL_FROM='College Fantasy Beta Pilot <noreply@example.test>' \
            -e CFF_SMTP_HOST=127.0.0.1 \
            -e CFF_SMTP_PORT=1025 \
            -e CFF_SMTP_SECURITY=none \
            -e CFF_SMTP_USERNAME=test-user \
            -e CFF_SMTP_PASSWORD=test-password \
            -e CFF_MIN_PASSWORD_LENGTH=12 \
            -e CFF_MAX_REQUEST_BODY_BYTES=262144 \
            -e CFF_AUTH_REQUEST_BODY_BYTES=8192 \
            -e CFF_AUTH_BURST_CLIENT_LIMIT=500 \
            -e CFF_SIGNUP_CLIENT_LIMIT=500 \
            -e CFF_SIGNUP_ACCOUNT_LIMIT=100 \
            -e CFF_SIGNUP_RATE_WINDOW_MINUTES=60 \
            college-ff-api-beta-pilot

      - name: Run exact-commit four-manager pilot
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          python3 scripts/beta_pilot_runtime_contract.py 2>&1 | tee /tmp/beta-pilot-runtime.log

      - name: Print pilot diagnostics
        if: always()
        shell: bash
        run: |
          echo "## Beta pilot report"
          if test -f /tmp/beta-pilot-runtime.json; then
            cat /tmp/beta-pilot-runtime.json
          fi
          echo "## Pilot runtime log"
          if test -f /tmp/beta-pilot-runtime.log; then
            cat /tmp/beta-pilot-runtime.log
          fi
          echo "## SMTP log"
          if test -f /tmp/cff-beta-pilot-smtp.log; then
            cat /tmp/cff-beta-pilot-smtp.log
          fi
          echo "## API logs"
          docker logs college-ff-api-beta-pilot || true

      - name: Stop isolated services
        if: always()
        shell: bash
        run: |
          docker rm -f college-ff-api-beta-pilot || true
          if test -f /tmp/cff-beta-pilot-smtp.pid; then
            kill "$(cat /tmp/cff-beta-pilot-smtp.pid)" || true
          fi
