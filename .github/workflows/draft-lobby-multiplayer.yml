name: Draft lobby multiplayer contracts

on:
  pull_request:
    branches: [Test]
    paths:
      - "backend/src/league_routes.cpp"
      - "backend/src/handlers/league_handler.h"
      - "backend/src/handlers/league_handler.cpp"
      - "backend/src/league_beta_stability.cpp"
      - "backend/tests/draft_lobby_multiplayer_boundary_tests.py"
      - "backend/tests/draft_room_active_member_entry_tests.py"
      - "backend/tests/private_page_auth_recovery_tests.py"
      - "backend/tests/auth_session_sync_behavior_tests.js"
      - "frontend/state.js"
      - "frontend/draft.js"
      - "frontend/draft.html"
      - "frontend/draft-auth-bridge.js"
      - "frontend/auth-session-sync.js"
      - "frontend/beta-ui.js"
      - "frontend/league.js"
      - "frontend/league.html"
      - "frontend/league-beta-stability.js"
      - "scripts/draft_lobby_multiplayer_tests.py"
      - ".github/workflows/draft-lobby-multiplayer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draft-lobby-multiplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multiplayer-draft:
    name: Lobby entry, explicit start, and shared picks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cff
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify draft lobby ownership and frontend syntax
        run: |
          python -m py_compile scripts/draft_lobby_multiplayer_tests.py backend/tests/draft_lobby_multiplayer_boundary_tests.py backend/tests/draft_room_active_member_entry_tests.py backend/tests/private_page_auth_recovery_tests.py
          python backend/tests/draft_lobby_multiplayer_boundary_tests.py
          python backend/tests/draft_room_active_member_entry_tests.py
          python backend/tests/private_page_auth_recovery_tests.py
          node backend/tests/auth_session_sync_behavior_tests.js
          node --check backend/tests/auth_session_sync_behavior_tests.js
          node --check frontend/state.js
          node --check frontend/draft.js
          node --check frontend/draft-auth-bridge.js
          node --check frontend/auth-session-sync.js
          node --check frontend/beta-ui.js
          node --check frontend/league.js
          node --check frontend/league-beta-stability.js

      - name: Build production API image
        run: docker build -f backend/Dockerfile -t college-ff-api ./backend

      - name: Run database migrations
        run: |
          docker run --rm --network host \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            college-ff-api sh /srv/db/migrate.sh

      - name: Start production API
        run: |
          docker run -d --name college-ff-api --network host \
            -e PORT=8080 \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            -e JWT_SECRET=draft-lobby-ci-secret \
            -e CFF_REQUIRE_DB=true \
            -e CFF_ALLOW_SHARED_SECRET_AUTH=false \
            -e CFF_REQUIRE_EMAIL_VERIFICATION=false \
            -e ALLOWED_ORIGINS=https://college-fantasy-football.com \
            college-ff-api

      - name: Wait for healthy API
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/health \
              | python -c 'import json, sys; payload = json.load(sys.stdin); raise SystemExit(0 if payload.get("status") == "ok" else 1)'; then
              exit 0
            fi
            sleep 2
          done
          docker logs college-ff-api
          exit 1

      - name: Run multiplayer draft integration contract
        env:
          CFF_API_BASE_URL: http://127.0.0.1:8080
        run: python scripts/draft_lobby_multiplayer_tests.py

      - name: Reject whitespace errors
        run: git diff --check

      - name: Backend logs
        if: always()
        run: docker logs college-ff-api || true
