name: Public route runtime contracts

on:
  push:
    branches: [main, Test]
    paths:
      - "backend/CMakeLists.txt"
      - "backend/Dockerfile"
      - "backend/docker-entrypoint.sh"
      - "backend/src/**"
      - "backend/db/**"
      - "scripts/public_route_runtime_contracts.py"
      - ".github/workflows/public-route-runtime-tests.yml"
  pull_request:
    branches: [main, Test]
    paths:
      - "backend/CMakeLists.txt"
      - "backend/Dockerfile"
      - "backend/docker-entrypoint.sh"
      - "backend/src/**"
      - "backend/db/**"
      - "scripts/public_route_runtime_contracts.py"
      - ".github/workflows/public-route-runtime-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-route-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-route-runtime:
    name: Public routes with production image and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cff
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate runtime contract source
        run: python -m py_compile scripts/public_route_runtime_contracts.py

      - name: Build production API image
        run: docker build -f backend/Dockerfile -t college-ff-public-contracts .

      - name: Apply production migrations
        run: |
          docker run --rm --network host \
            --entrypoint sh \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            college-ff-public-contracts \
            /srv/db/migrate.sh

      - name: Seed isolated public route fixtures
        shell: bash
        run: |
          set -euo pipefail
          docker run -i --rm --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d cff -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO players (
              id, full_name, team, position, conference, year,
              season, updated_at, active
          )
          SELECT
              'public-contract-' || lpad(value::text, 3, '0'),
              'Public Contract Player ' || lpad(value::text, 3, '0'),
              CASE WHEN value % 2 = 0 THEN 'Wyoming' ELSE 'Colorado State' END,
              CASE value % 5
                  WHEN 1 THEN 'QB'
                  WHEN 2 THEN 'RB'
                  WHEN 3 THEN 'WR'
                  WHEN 4 THEN 'TE'
                  ELSE 'K'
              END,
              CASE WHEN value % 3 = 0 THEN 'SEC' ELSE 'Mountain West' END,
              'Senior',
              2026,
              NOW(),
              TRUE
          FROM generate_series(1, 105) AS value
          ON CONFLICT (id) DO UPDATE SET
              full_name = EXCLUDED.full_name,
              team = EXCLUDED.team,
              position = EXCLUDED.position,
              conference = EXCLUDED.conference,
              year = EXCLUDED.year,
              season = EXCLUDED.season,
              updated_at = EXCLUDED.updated_at,
              active = EXCLUDED.active;

          INSERT INTO live_score_cache (
              id, payload, fetched_at, status, last_error,
              game_count, live_game_count, schedule_payload,
              schedule_fetched_at, schedule_game_count, updated_at
          )
          VALUES (
              1,
              '[{"id":"public-game-1","home":"Wyoming","away":"Colorado State","homeScore":21,"awayScore":14,"live":true,"status":"in_progress"},{"id":"public-game-2","home":"Alabama","away":"Georgia","homeScore":28,"awayScore":24,"live":false,"status":"final"}]'::jsonb,
              NOW(),
              'ok',
              NULL,
              2,
              1,
              '[{"id":"public-game-1"},{"id":"public-game-2"}]'::jsonb,
              NOW(),
              2,
              NOW()
          )
          ON CONFLICT (id) DO UPDATE SET
              payload = EXCLUDED.payload,
              fetched_at = EXCLUDED.fetched_at,
              status = EXCLUDED.status,
              last_error = EXCLUDED.last_error,
              game_count = EXCLUDED.game_count,
              live_game_count = EXCLUDED.live_game_count,
              schedule_payload = EXCLUDED.schedule_payload,
              schedule_fetched_at = EXCLUDED.schedule_fetched_at,
              schedule_game_count = EXCLUDED.schedule_game_count,
              updated_at = EXCLUDED.updated_at;
          SQL

      - name: Verify isolated public route fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_state="$(docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d cff -tA -F '|' -v ON_ERROR_STOP=1 \
            -c "SELECT (SELECT COUNT(*) FROM players WHERE id LIKE 'public-contract-%'), jsonb_array_length(payload), game_count, live_game_count, schedule_game_count FROM live_score_cache WHERE id=1")"
          IFS='|' read -r player_count payload_count game_count live_game_count schedule_game_count <<< "$fixture_state"
          test "$player_count" = "105"
          test "$payload_count" = "2"
          test "$game_count" = "2"
          test "$live_game_count" = "1"
          test "$schedule_game_count" = "2"

      - name: Generate ephemeral runtime secret
        shell: bash
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "CFF_PUBLIC_TEST_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"

      - name: Start production API
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name college-ff-public-contracts --network host \
            -e PORT=8080 \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            -e JWT_SECRET="$CFF_PUBLIC_TEST_JWT_SECRET" \
            -e ALLOWED_ORIGINS=https://frontend.example.test \
            -e CFF_REQUIRE_DB=true \
            -e CFF_RUN_MIGRATIONS_ON_STARTUP=false \
            -e ESPN_ROSTER_AUTO_ONCE=false \
            -e CFBD_INGEST_ON_STARTUP=false \
            -e CFF_ALLOW_SHARED_SECRET_AUTH=false \
            -e CFF_REQUIRE_EMAIL_VERIFICATION=false \
            -e CFF_EXPOSE_AUTH_TOKENS=false \
            -e CFF_LOG_AUTH_TOKENS=false \
            -e CFF_SECURITY_ENFORCE_PRODUCTION=true \
            -e CFF_TRUST_PROXY_HEADERS=false \
            -e CFF_FRONTEND_BASE_URL=https://frontend.example.test \
            -e CFF_EMAIL_PROVIDER=smtp \
            -e CFF_EMAIL_FROM='College Fantasy Test <noreply@example.test>' \
            -e CFF_SMTP_HOST=127.0.0.1 \
            -e CFF_SMTP_PORT=1025 \
            -e CFF_SMTP_SECURITY=none \
            -e CFF_SMTP_USERNAME=test-user \
            -e CFF_SMTP_PASSWORD=test-password \
            college-ff-public-contracts

      - name: Run public route runtime contracts
        shell: bash
        env:
          CFF_API_BASE_URL: http://127.0.0.1:8080
          CFF_CONTRACT_ORIGIN: https://frontend.example.test
        run: |
          set -o pipefail
          python scripts/public_route_runtime_contracts.py 2>&1 | tee /tmp/public-route-runtime.log

      - name: Retain public route diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-route-runtime-diagnostics
          path: /tmp/public-route-runtime.log
          if-no-files-found: warn
          retention-days: 7

      - name: Backend logs
        if: always()
        run: docker logs college-ff-public-contracts || true
