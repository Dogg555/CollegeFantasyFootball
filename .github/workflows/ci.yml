name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and deployment syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          for file in frontend/*.js; do
            echo "Checking ${file}"
            node --check "${file}"
          done
      - name: Python deployment syntax checks
        run: |
          python -m py_compile \
            scripts/alpha_readiness.py \
            scripts/alpha_ui_contract_tests.py \
            scripts/public_data_meta_tests.py \
            scripts/api_smoke_tests.py \
            scripts/authorization_security_tests.py \
            scripts/render_deploy_and_wait.py \
            scripts/render_smoke_tests.py \
            scripts/frontend_browser_smoke.py \
            scripts/offsite_backup.py \
            scripts/restore_backup.py \
            scripts/release_gate_common.py \
            scripts/email_acceptance.py \
            scripts/data_ingestion_validation.py \
            scripts/full_lifecycle_tests.py \
            scripts/release_gate_unit_tests.py \
            scripts/ops_ingest.py \
            scripts/ops_ingest_tests.py \
            scripts/ops_live_ingest.py \
            scripts/ops_live_ingest_tests.py
      - name: Test release-gate helpers and ingestion runners
        run: |
          python scripts/release_gate_unit_tests.py
          python scripts/ops_ingest_tests.py
          python scripts/ops_live_ingest_tests.py
      - name: Test scoreboard and Alpha UI contracts
        run: |
          node scripts/scoreboard_ui_tests.js
          python scripts/alpha_ui_contract_tests.py
      - name: Validate Render Blueprint and release workflows
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import pathlib
          import yaml

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise AssertionError(f'duplicate YAML key: {key}')
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )

          with open('render.yaml', encoding='utf-8') as handle:
              blueprint = yaml.load(handle, Loader=UniqueKeyLoader)

          services = {service['name']: service for service in blueprint['services']}
          api = services['college-ff-api']
          roster = services['college-ff-cfbd-ingest']
          live = services['college-ff-live-ingest']
          backup = services['college-ff-db-backup']

          api_env = {item.get('key'): item for item in api['envVars'] if item.get('key')}
          assert api_env['CFBD_INGEST_ON_STARTUP']['value'] == 'false'
          assert api_env['CFBD_INGEST_INTERVAL_HOURS']['value'] == '0'

          assert roster['type'] == 'cron'
          assert roster['runtime'] == 'python'
          assert roster['schedule'] == '0 10 * * 2'
          assert 'ops_ingest.py --run' in roster['startCommand']

          assert live['type'] == 'cron'
          assert live['runtime'] == 'python'
          assert live['schedule'] == '*/2 * * 1,8,9,10,11,12 *'
          assert 'ops_live_ingest.py' in live['startCommand']

          assert backup['type'] == 'cron'
          assert backup['schedule'] == '0 7 * * *'
          backup_env = {item['key']: item for item in backup['envVars']}
          assert backup_env['CFF_BACKUP_SSE']['value'] == 'AES256'
          assert backup_env['CFF_BACKUP_RETENTION_DAYS']['value'] == '30'
          assert backup_env['CFF_BACKUP_VERIFY_UPLOAD']['value'] == 'true'
          assert int(backup_env['CFF_BACKUP_MIN_BYTES']['value']) >= 1024
          assert backup_env['AWS_ENDPOINT_URL']['sync'] is False

          for service in (roster, live):
              env = {item['key']: item for item in service['envVars']}
              assert env['CFF_API_HOSTPORT']['fromService'] == {
                  'type': 'web',
                  'name': 'college-ff-api',
                  'property': 'hostport',
              }
              assert env['CFF_ADMIN_API_TOKEN']['fromService'] == {
                  'type': 'web',
                  'name': 'college-ff-api',
                  'envVarKey': 'CFF_ADMIN_API_TOKEN',
              }

          for workflow_path in (
              '.github/workflows/alpha-readiness.yml',
              '.github/workflows/backup-restore-validation.yml',
          ):
              with open(workflow_path, encoding='utf-8') as handle:
                  workflow = yaml.load(handle, Loader=UniqueKeyLoader)
              assert workflow

          required_scripts = {
              'scripts/email_acceptance.py',
              'scripts/data_ingestion_validation.py',
              'scripts/full_lifecycle_tests.py',
              'scripts/restore_backup.py',
          }
          assert all(pathlib.Path(path).is_file() for path in required_scripts)
          PY
      - name: Validate Render frontend build
        env:
          CFF_API_BASE: https://example.invalid/api
          CFF_ALLOW_LOCAL_DEMO: "false"
          RENDER_GIT_COMMIT: 0123456789abcdef
          RENDER_GIT_BRANCH: ci
        run: |
          sh scripts/render-build-frontend.sh
          node --check frontend-dist/config.js
          test -f frontend-dist/polish.css
          test -f frontend-dist/alpha-ui.css
          test -f frontend-dist/build-info.json
          grep -F "window.CFF_API_BASE = 'https://example.invalid/api';" frontend-dist/config.js
          grep -F "window.CFF_ALLOW_LOCAL_DEMO = false;" frontend-dist/config.js
          grep -F "Shared pre-beta UX" frontend-dist/polish.css
          grep -F "Alpha release responsive dashboards" frontend-dist/alpha-ui.css
          python - <<'PY'
          import json
          with open('frontend-dist/build-info.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload == {'commit': '0123456789abcdef', 'branch': 'ci'}
          PY

  docker-validation:
    name: Docker build and Postgres smoke
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cff
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build production images
        run: |
          docker build -f backend/Dockerfile -t college-ff-api ./backend
          docker build -f ops/backup/Dockerfile -t college-ff-db-backup .

      - name: Verify runtime images are non-root
        run: |
          api_uid="$(docker run --rm --entrypoint id college-ff-api -u)"
          backup_uid="$(docker run --rm --entrypoint id college-ff-db-backup -u)"
          test "$api_uid" != "0"
          test "$backup_uid" != "0"

      - name: Run production migrations
        run: |
          docker run --rm --network host \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            college-ff-api sh /srv/db/migrate.sh

      - name: Start the production backend image
        run: |
          docker run -d --name college-ff-api --network host \
            -e PORT=8080 \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            -e JWT_SECRET=ci-secret \
            -e CFF_ADMIN_API_TOKEN=ci-live-score-admin-token \
            -e CFF_REQUIRE_DB=true \
            -e CFF_ALLOW_SHARED_SECRET_AUTH=false \
            -e CFF_REQUIRE_EMAIL_VERIFICATION=false \
            -e CFF_EXPOSE_AUTH_TOKENS=true \
            college-ff-api

      - name: Require healthy API and database
        run: |
          set -euo pipefail
          for i in {1..45}; do
            if payload="$(curl -fsS http://127.0.0.1:8080/health 2>/dev/null)"; then
              if python - "$payload" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          if payload.get("status") != "ok" or payload.get("database") != "ok":
              raise SystemExit(1)
          print(json.dumps(payload, indent=2))
          PY
              then
                exit 0
              fi
            fi
            sleep 2
          done
          docker logs college-ff-api
          exit 1

      - name: Verify cached live score endpoints
        env:
          CFF_ADMIN_API_TOKEN: ci-live-score-admin-token
        run: |
          scores="$(curl -fsS http://127.0.0.1:8080/api/scores/live)"
          status="$(curl -fsS http://127.0.0.1:8080/api/admin/ingest/cfbd/live/status -H "Authorization: Bearer ${CFF_ADMIN_API_TOKEN}")"
          python - "$scores" "$status" <<'PY'
          import json
          import sys

          scores = json.loads(sys.argv[1])
          status = json.loads(sys.argv[2])
          assert isinstance(scores, list)
          assert status['databaseConfigured'] is True
          assert status['configured'] is False
          assert status['status'] == 'never'
          assert status['monthlyApiCalls'] == 0
          PY

      - name: Run full API smoke suite against Docker
        env:
          CFF_API_BASE_URL: http://127.0.0.1:8080
        run: |
          python scripts/api_smoke_tests.py
          python scripts/authorization_security_tests.py
          python scripts/public_data_meta_tests.py

      - name: Backend logs
        if: always()
        run: docker logs college-ff-api || true
