name: Bootstrap league schedule extraction

on:
  pull_request:
    branches: [Test]
    paths:
      - "scripts/bootstrap_extract_league_schedule.py"
      - ".github/workflows/bootstrap-league-schedule.yml"
      - "backend/src/league_schedule.h"
      - "backend/src/league_schedule.cpp"
      - "backend/tests/league_schedule_tests.cpp"
      - "backend/tests/league_schedule_boundary_tests.py"

permissions:
  contents: write

jobs:
  apply-extraction:
    name: Apply isolated schedule extraction
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply guarded source transformation
        run: python scripts/bootstrap_extract_league_schedule.py

      - name: Verify generated ownership boundary
        run: python backend/tests/league_schedule_boundary_tests.py

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit generated integration
        run: |
          if git diff --quiet -- backend/src/handlers/league_handler.cpp backend/CMakeLists.txt; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/handlers/league_handler.cpp backend/CMakeLists.txt
          git commit -m "Integrate league schedule domain module"
          git push
