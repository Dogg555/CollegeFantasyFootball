name: Signup hardening

on:
  push:
    branches: [main]
    paths:
      - "backend/CMakeLists.txt"
      - "backend/src/security_hardening.cpp"
      - "backend/src/signup_response.cpp"
      - "backend/db/account-admin.sh"
      - "frontend/auth.js"
      - "frontend/config.js"
      - "render.yaml"
      - ".env.example"
      - "scripts/signup_security_tests.py"
      - "scripts/auth_frontend_contract_tests.py"
      - ".github/workflows/signup-hardening.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/CMakeLists.txt"
      - "backend/src/security_hardening.cpp"
      - "backend/src/signup_response.cpp"
      - "backend/db/account-admin.sh"
      - "frontend/auth.js"
      - "frontend/config.js"
      - "render.yaml"
      - ".env.example"
      - "scripts/signup_security_tests.py"
      - "scripts/auth_frontend_contract_tests.py"
      - ".github/workflows/signup-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signup-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signup:
    name: Signup, duplicate prevention, and account reset
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cff
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate frontend and account tooling
        run: |
          node --check frontend/auth.js
          sh -n backend/db/account-admin.sh
          python scripts/auth_frontend_contract_tests.py
          python -m py_compile scripts/signup_security_tests.py

      - name: Build production API image
        run: docker build -f backend/Dockerfile -t college-ff-api-signup .

      - name: Apply production migrations
        run: |
          docker run --rm --network host \
            --entrypoint sh \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            college-ff-api-signup \
            /srv/db/migrate.sh

      - name: Install test-only rejected signup trigger
        run: |
          docker run --rm -i --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d cff -v ON_ERROR_STOP=1 <<'SQL'
          CREATE OR REPLACE FUNCTION reject_forced_signup()
          RETURNS TRIGGER AS $$
          BEGIN
            IF NEW.email LIKE 'forced-failure-%@example.test' THEN
              RAISE EXCEPTION 'forced signup insert failure' USING ERRCODE = '23514';
            END IF;
            RETURN NEW;
          END;
          $$ LANGUAGE plpgsql;

          DROP TRIGGER IF EXISTS trg_reject_forced_signup ON users;
          CREATE TRIGGER trg_reject_forced_signup
          BEFORE INSERT ON users
          FOR EACH ROW
          EXECUTE FUNCTION reject_forced_signup();
          SQL

      - name: Generate ephemeral test values
        shell: bash
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -hex 32)"
          admin_token="$(openssl rand -hex 32)"
          account_password="$(openssl rand -base64 32 | tr -d '\n' | tr '/+' 'Aa')-A1!"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_token"
          echo "::add-mask::$account_password"
          echo "CFF_TEST_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "CFF_TEST_ADMIN_TOKEN=$admin_token" >> "$GITHUB_ENV"
          echo "CFF_ACCOUNT_RESET_PASSWORD=$account_password" >> "$GITHUB_ENV"
          echo "CFF_ACCOUNT_RESET_EMAIL=account-reset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test" >> "$GITHUB_ENV"

      - name: Start verification-required API without email delivery
        run: |
          docker run -d --name college-ff-api-signup --network host \
            -e PORT=8080 \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            -e JWT_SECRET="$CFF_TEST_JWT_SECRET" \
            -e ALLOWED_ORIGINS=https://frontend.example.test \
            -e CFF_ADMIN_API_TOKEN="$CFF_TEST_ADMIN_TOKEN" \
            -e CFF_REQUIRE_DB=true \
            -e CFF_RUN_MIGRATIONS_ON_STARTUP=false \
            -e CFF_ALLOW_SHARED_SECRET_AUTH=false \
            -e CFF_REQUIRE_EMAIL_VERIFICATION=true \
            -e CFF_EXPOSE_AUTH_TOKENS=false \
            -e CFF_LOG_AUTH_TOKENS=false \
            -e CFF_SECURITY_ENFORCE_PRODUCTION=true \
            -e CFF_TRUST_PROXY_HEADERS=false \
            -e CFF_MIN_PASSWORD_LENGTH=12 \
            -e CFF_MAX_REQUEST_BODY_BYTES=262144 \
            -e CFF_AUTH_REQUEST_BODY_BYTES=8192 \
            -e CFF_AUTH_BURST_CLIENT_LIMIT=240 \
            -e CFF_AUTH_BURST_WINDOW_SECONDS=60 \
            -e CFF_SIGNUP_CLIENT_LIMIT=120 \
            -e CFF_SIGNUP_ACCOUNT_LIMIT=5 \
            -e CFF_SIGNUP_RATE_WINDOW_MINUTES=60 \
            college-ff-api-signup

      - name: Run signup reliability and security tests
        shell: bash
        env:
          CFF_API_BASE_URL: http://127.0.0.1:8080
          CFF_SECURITY_TEST_ORIGIN: https://frontend.example.test
        run: |
          set -o pipefail
          python scripts/signup_security_tests.py 2>&1 | tee signup-security-test.log

      - name: Retain signup test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signup-security-diagnostics
          path: signup-security-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prove test account reset and re-registration
        shell: bash
        run: |
          set -euo pipefail
          signup() {
            local output_file="$1"
            curl -sS -o "$output_file" -w '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -H 'Origin: https://frontend.example.test' \
              --data "$(python -c 'import json, os; print(json.dumps({"email": os.environ["CFF_ACCOUNT_RESET_EMAIL"], "password": os.environ["CFF_ACCOUNT_RESET_PASSWORD"]}))')" \
              http://127.0.0.1:8080/api/auth/signup
          }

          first_status="$(signup /tmp/account-reset-first.json)"
          test "$first_status" = "201"

          docker run --rm --network host \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            --entrypoint sh college-ff-api-signup \
            /srv/db/account-admin.sh inspect --email "$CFF_ACCOUNT_RESET_EMAIL"

          if docker run --rm --network host \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            --entrypoint sh college-ff-api-signup \
            /srv/db/account-admin.sh delete --email "$CFF_ACCOUNT_RESET_EMAIL"; then
            echo "Account deletion succeeded without exact confirmation" >&2
            exit 1
          fi

          docker run --rm --network host \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            --entrypoint sh college-ff-api-signup \
            /srv/db/account-admin.sh delete \
              --email "$CFF_ACCOUNT_RESET_EMAIL" \
              --confirm-email "$CFF_ACCOUNT_RESET_EMAIL"

          remaining="$(docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d cff -tAc \
            "SELECT COUNT(*) FROM users WHERE email = lower('$CFF_ACCOUNT_RESET_EMAIL')")"
          test "$remaining" = "0"

          second_status="$(signup /tmp/account-reset-second.json)"
          test "$second_status" = "201"

          duplicate_rows="$(docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d cff -tAc \
            "SELECT COUNT(*) FROM users WHERE email = lower('$CFF_ACCOUNT_RESET_EMAIL')")"
          test "$duplicate_rows" = "1"

      - name: Verify account and recovery tokens are hashed
        run: |
          raw_recovery="$(docker run --rm --network host -e PGPASSWORD=postgres postgres:16 psql -h 127.0.0.1 -U postgres -d cff -tAc "SELECT COUNT(*) FROM users WHERE email_verification_token LIKE 'token-%' OR password_reset_token LIKE 'token-%'")"
          raw_sessions="$(docker run --rm --network host -e PGPASSWORD=postgres postgres:16 psql -h 127.0.0.1 -U postgres -d cff -tAc "SELECT COUNT(*) FROM auth_tokens WHERE token LIKE 'token-%'")"
          duplicate_accounts="$(docker run --rm --network host -e PGPASSWORD=postgres postgres:16 psql -h 127.0.0.1 -U postgres -d cff -tAc "SELECT COUNT(*) FROM (SELECT lower(email) FROM users GROUP BY lower(email) HAVING COUNT(*) > 1) duplicates")"
          test "$raw_recovery" = "0"
          test "$raw_sessions" = "0"
          test "$duplicate_accounts" = "0"

      - name: Backend logs
        if: always()
        run: docker logs college-ff-api-signup || true
