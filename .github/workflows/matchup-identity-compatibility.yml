name: Matchup identity compatibility

on:
  pull_request:
    branches: [main, Test]
    paths:
      - "backend/db/migrations/020_matchup_identity_compatibility.sql"
      - "backend/src/schedule_lineup_hardening_advice.inc"
      - "backend/src/roster_transaction_hardening_db.inc"
      - "backend/tests/matchup_identity_compatibility_contract_tests.py"
      - "scripts/schedule_lineup_runtime_contract.py"
      - "scripts/scoring_lifecycle_runtime_contract.py"
      - ".github/workflows/matchup-identity-compatibility.yml"
  push:
    branches: [main, Test]
    paths:
      - "backend/db/migrations/020_matchup_identity_compatibility.sql"
      - "backend/src/schedule_lineup_hardening_advice.inc"
      - "backend/src/roster_transaction_hardening_db.inc"
      - "backend/tests/matchup_identity_compatibility_contract_tests.py"
      - ".github/workflows/matchup-identity-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matchup-identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate compatibility sources
        run: |
          python -m py_compile backend/tests/matchup_identity_compatibility_contract_tests.py
          python backend/tests/matchup_identity_compatibility_contract_tests.py

  postgres-runtime:
    name: PostgreSQL schedule and scoring compatibility
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cff
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Validate runtime scripts
        run: python -m py_compile scripts/schedule_lineup_runtime_contract.py scripts/scoring_lifecycle_runtime_contract.py scripts/test_smtp_server.py
      - name: Build production API image
        run: docker build -f backend/Dockerfile -t college-ff-api-identity-contracts .
      - name: Apply production migrations
        run: |
          docker run --rm --network host \
            --entrypoint sh \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            college-ff-api-identity-contracts \
            /srv/db/migrate.sh
      - name: Verify migration trigger directly
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d cff -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (email, password_hash, email_verified)
          VALUES ('identity-contract@example.test', 'contract', TRUE)
          ON CONFLICT (email) DO NOTHING;
          INSERT INTO leagues (id, account_email, name, team_count)
          VALUES ('identity-contract', 'identity-contract@example.test', 'Identity Contract', 4)
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO league_matchups
            (id, league_id, season, week, home_manager_email, away_manager_email)
          VALUES
            ('identity-matchup-a', 'identity-contract', 2026, 1, 'a@example.test', 'b@example.test'),
            ('identity-matchup-b', 'identity-contract', 2026, 1, 'c@example.test', 'd@example.test');
          DO $$
          BEGIN
            IF (SELECT COUNT(DISTINCT identity_key) FROM league_matchups WHERE league_id = 'identity-contract') <> 2 THEN
              RAISE EXCEPTION 'identity trigger did not assign unique keys';
            END IF;
          END $$;
          SQL
      - name: Generate isolated values
        shell: bash
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -hex 32)"
          admin_token="$(openssl rand -hex 32)"
          password="$(openssl rand -base64 24 | tr -d '\n' | tr '/+' 'Rr')-R4!"
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for value in "$jwt_secret" "$admin_token" "$password"; do echo "::add-mask::$value"; done
          echo "CFF_IDENTITY_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "CFF_IDENTITY_ADMIN_TOKEN=$admin_token" >> "$GITHUB_ENV"
          echo "CFF_CONTRACT_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "CFF_SCHEDULE_RUN_KEY=$run_key-schedule" >> "$GITHUB_ENV"
          echo "CFF_SCORING_RUN_KEY=$run_key-scoring" >> "$GITHUB_ENV"
      - name: Start SMTP catcher
        shell: bash
        run: |
          : > /tmp/cff-identity-mail.jsonl
          python scripts/test_smtp_server.py --host 127.0.0.1 --port 1025 --output /tmp/cff-identity-mail.jsonl > /tmp/cff-identity-smtp.log 2>&1 &
          echo $! > /tmp/cff-identity-smtp.pid
          python - <<'PY'
          import socket, time
          for _ in range(30):
              try:
                  with socket.create_connection(("127.0.0.1", 1025), timeout=1):
                      raise SystemExit(0)
              except OSError:
                  time.sleep(1)
          raise SystemExit("SMTP test server did not become ready")
          PY
      - name: Start production API
        shell: bash
        run: |
          docker run -d --name college-ff-api-identity-contracts --network host \
            -e PORT=8080 \
            -e DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/cff \
            -e JWT_SECRET="$CFF_IDENTITY_JWT_SECRET" \
            -e ALLOWED_ORIGINS=https://frontend.example.test \
            -e CFF_ADMIN_API_TOKEN="$CFF_IDENTITY_ADMIN_TOKEN" \
            -e CFF_REQUIRE_DB=true \
            -e CFF_RUN_MIGRATIONS_ON_STARTUP=false \
            -e ESPN_ROSTER_AUTO_ONCE=false \
            -e CFF_ALLOW_SHARED_SECRET_AUTH=false \
            -e CFF_REQUIRE_EMAIL_VERIFICATION=false \
            -e CFF_EXPOSE_AUTH_TOKENS=false \
            -e CFF_LOG_AUTH_TOKENS=false \
            -e CFF_SECURITY_ENFORCE_PRODUCTION=true \
            -e CFF_TRUST_PROXY_HEADERS=false \
            -e CFF_FRONTEND_BASE_URL=https://frontend.example.test \
            -e CFF_EMAIL_PROVIDER=smtp \
            -e CFF_EMAIL_FROM='College Fantasy Identity Test <noreply@example.test>' \
            -e CFF_SMTP_HOST=127.0.0.1 \
            -e CFF_SMTP_PORT=1025 \
            -e CFF_SMTP_SECURITY=none \
            -e CFF_SMTP_USERNAME=test-user \
            -e CFF_SMTP_PASSWORD=test-password \
            -e CFF_MIN_PASSWORD_LENGTH=12 \
            -e CFF_MAX_REQUEST_BODY_BYTES=262144 \
            -e CFF_AUTH_REQUEST_BODY_BYTES=8192 \
            -e CFF_AUTH_BURST_CLIENT_LIMIT=500 \
            -e CFF_SIGNUP_CLIENT_LIMIT=500 \
            -e CFF_SIGNUP_ACCOUNT_LIMIT=100 \
            -e CFF_SIGNUP_RATE_WINDOW_MINUTES=60 \
            college-ff-api-identity-contracts
      - name: Run schedule and scoring production contracts
        env:
          CFF_API_BASE_URL: http://127.0.0.1:8080
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/cff
          CFF_CONTRACT_ORIGIN: https://frontend.example.test
        run: |
          set -o pipefail
          python scripts/schedule_lineup_runtime_contract.py 2>&1 | tee /tmp/schedule-runtime.log
          python scripts/scoring_lifecycle_runtime_contract.py 2>&1 | tee /tmp/scoring-runtime.log
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchup-identity-runtime-diagnostics
          path: |
            /tmp/schedule-runtime.log
            /tmp/scoring-runtime.log
            /tmp/cff-identity-mail.jsonl
            /tmp/cff-identity-smtp.log
          if-no-files-found: warn
          retention-days: 7
      - name: Backend logs
        if: always()
        run: docker logs college-ff-api-identity-contracts || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f college-ff-api-identity-contracts || true
          if test -f /tmp/cff-identity-smtp.pid; then kill "$(cat /tmp/cff-identity-smtp.pid)" || true; fi
