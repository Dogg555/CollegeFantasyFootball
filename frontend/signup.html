<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account - College Fantasy Football</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand__logo">CF</div>
      <div>
        <div class="brand__title">College Fantasy</div>
        <div class="brand__subtitle">Modern manager hub</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav__link" data-page="home" href="index.html">Home</a>
      <a class="nav__link" data-page="league" href="league.html">Leagues</a>
      <a class="nav__link" data-page="players" href="players.html">Players</a>
    </nav>
    <div class="nav__actions">
      <a class="button button--ghost" href="signin.html">Sign in</a>
    </div>
  </div>

  <main class="auth-layout">
    <section class="card card--accent auth-card">
      <div class="card__header">
        <h2>Create account</h2>
        <span class="pill">New</span>
      </div>
      <form id="signup-form" class="form" method="post" action="javascript:void(0)" onsubmit="return false">
        <label class="field">
          <span>Email</span>
          <input id="signup-email" type="email" name="email" placeholder="you@example.com" required maxlength="254" autocomplete="email" />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="signup-password" type="password" name="password" placeholder="Choose a password" required minlength="12" maxlength="72" autocomplete="new-password" aria-describedby="signup-password-help" />
          <span id="signup-password-help" class="muted small">Use 12–72 characters and avoid common passwords or your email name.</span>
        </label>
        <div class="actions">
          <button class="button button--primary" type="submit">Create account</button>
        </div>
        <div id="signup-status" class="muted small" role="status"></div>
      </form>
    </section>

    <section class="card auth-sidecar">
      <h2>Already registered?</h2>
      <p class="muted">Use your existing account to get back to leagues, draft queues, waivers, and trades.</p>
      <div id="auth-api-status" class="muted small" role="status"></div>
      <div class="cta-row">
        <a class="button" href="signin.html">Sign in</a>
      </div>
    </section>
  </main>

  <footer class="footer">Built for college fantasy managers.</footer>
  <script src="config.js"></script>
  <script src="state.js"></script>
  <script src="auth.js"></script>
</body>
</html>
