<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - College Fantasy Football</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand__logo">CF</div>
      <div>
        <div class="brand__title">College Fantasy</div>
        <div class="brand__subtitle">Modern manager hub</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav__link" data-page="home" href="index.html">Home</a>
      <a class="nav__link" data-page="league" href="league.html">Leagues</a>
      <a class="nav__link" data-page="players" href="players.html">Players</a>
    </nav>
    <div class="nav__actions">
      <a class="button button--ghost" href="signup.html">Create account</a>
      <button class="button button--ghost" id="signout-btn" type="button" hidden>Sign out</button>
    </div>
  </div>

  <main class="auth-layout">
    <section class="card card--accent auth-card">
      <div class="card__header">
        <h2>Sign in</h2>
        <span class="pill pill--muted">Returning</span>
      </div>
      <form id="login-form" class="form" method="post" action="javascript:void(0)" onsubmit="return false">
        <label class="field">
          <span>Email</span>
          <input id="login-email" type="email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="login-password" type="password" name="password" placeholder="Your password" required autocomplete="current-password" />
        </label>
        <div class="actions">
          <button class="button button--primary" type="submit">Sign in</button>
          <a class="button button--ghost" href="reset-request.html">Forgot password</a>
        </div>
        <div id="login-status" class="muted small" role="status"></div>
      </form>
    </section>

    <section class="card auth-sidecar">
      <h2>New here?</h2>
      <p class="muted">Create an account, verify your email, then come back here to manage leagues.</p>
      <div id="auth-note" class="muted small"></div>
      <div id="auth-api-status" class="muted small" role="status"></div>
      <div class="cta-row">
        <a class="button button--primary" href="signup.html">Create account</a>
        <a class="button" href="verify-email.html">Verify email</a>
      </div>
    </section>
  </main>

  <footer class="footer">Built for college fantasy managers.</footer>
  <script src="config.js"></script>
  <script src="state.js"></script>
  <script src="auth.js"></script>
</body>
</html>
