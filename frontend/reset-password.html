<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose new password - College Fantasy Football</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand__logo">CF</div>
      <div>
        <div class="brand__title">College Fantasy</div>
        <div class="brand__subtitle">Modern manager hub</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav__link" data-page="home" href="index.html">Home</a>
      <a class="nav__link" data-page="league" href="league.html">Leagues</a>
      <a class="nav__link" data-page="players" href="players.html">Players</a>
    </nav>
    <div class="nav__actions">
      <a class="button button--ghost" href="signin.html">Sign in</a>
    </div>
  </div>

  <main class="auth-layout">
    <section class="card card--accent auth-card">
      <div class="card__header">
        <h2>Choose new password</h2>
        <span class="pill pill--muted">Recovery</span>
      </div>
      <form id="reset-complete-form" class="form" method="post" action="javascript:void(0)" onsubmit="return false">
        <label class="field">
          <span>Reset token</span>
          <input id="reset-token" type="text" name="token" placeholder="Paste reset token" required maxlength="128" autocomplete="one-time-code" />
        </label>
        <label class="field">
          <span>New password</span>
          <input id="reset-password" type="password" name="password" placeholder="New password" required minlength="12" maxlength="72" autocomplete="new-password" aria-describedby="reset-password-help" />
          <span id="reset-password-help" class="muted small">Use 12–72 characters and avoid common passwords.</span>
        </label>
        <div class="actions">
          <button class="button button--primary" type="submit">Reset password</button>
        </div>
        <div id="reset-complete-status" class="muted small" role="status"></div>
      </form>
    </section>

    <section class="card auth-sidecar">
      <h2>Need a new link?</h2>
      <p class="muted">Request a new password reset email if this token has expired.</p>
      <div id="auth-api-status" class="muted small" role="status"></div>
      <div class="cta-row">
        <a class="button" href="reset-request.html">Request reset</a>
        <a class="button button--ghost" href="signin.html">Sign in</a>
      </div>
    </section>
  </main>

  <footer class="footer">Built for college fantasy managers.</footer>
  <script src="config.js"></script>
  <script src="state.js"></script>
  <script src="auth.js"></script>
</body>
</html>
