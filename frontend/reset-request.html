<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password - College Fantasy Football</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand__logo">CF</div>
      <div>
        <div class="brand__title">College Fantasy</div>
        <div class="brand__subtitle">Modern manager hub</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav__link" data-page="home" href="index.html">Home</a>
      <a class="nav__link" data-page="league" href="league.html">Leagues</a>
      <a class="nav__link" data-page="players" href="players.html">Players</a>
    </nav>
    <div class="nav__actions">
      <a class="button button--ghost" href="signin.html">Sign in</a>
    </div>
  </div>

  <main class="auth-layout">
    <section class="card card--accent auth-card">
      <div class="card__header">
        <h2>Request password reset</h2>
        <span class="pill pill--muted">Recovery</span>
      </div>
      <form id="reset-request-form" class="form" method="post" action="javascript:void(0)" onsubmit="return false">
        <label class="field">
          <span>Email</span>
          <input id="reset-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" />
        </label>
        <div class="actions">
          <button class="button button--primary" type="submit">Send reset link</button>
        </div>
        <div id="reset-request-status" class="muted small" role="status"></div>
      </form>
    </section>

    <section class="card auth-sidecar">
      <h2>Already have a token?</h2>
      <p class="muted">Use the reset token from your email to choose a new password.</p>
      <div id="auth-api-status" class="muted small" role="status"></div>
      <div class="cta-row">
        <a class="button" href="reset-password.html">Enter reset token</a>
      </div>
    </section>
  </main>

  <footer class="footer">Built for college fantasy managers.</footer>
  <script src="config.js"></script>
  <script src="state.js"></script>
  <script src="auth.js"></script>
</body>
</html>
