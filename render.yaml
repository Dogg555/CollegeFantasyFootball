services:
  - type: web
    name: college-ff-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    preDeployCommand: sh /srv/db/migrate.sh
    envVars:
      - key: DB_URL
        fromDatabase:
          name: college-ff-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: CFF_ADMIN_API_TOKEN
        generateValue: true
      - key: CFF_ADMIN_EMAILS
        sync: false
      - key: CFBD_INGEST_ON_STARTUP
        value: "false"
      - key: CFBD_INGEST_INTERVAL_HOURS
        value: "0"
      - key: RESEND_API_KEY
        sync: false
      - key: CFF_EMAIL_FROM
        sync: false
      - key: CFF_FRONTEND_BASE_URL
        sync: false
      - key: CFF_REQUIRE_DB
        value: "true"
      - key: CFF_ALLOW_SHARED_SECRET_AUTH
        value: "false"
      - key: CFF_REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: CFF_EXPOSE_AUTH_TOKENS
        value: "false"
      - key: CFF_LOG_AUTH_TOKENS
        value: "false"
      - key: CFF_SECURITY_ENFORCE_PRODUCTION
        value: "true"
      - key: CFF_TRUST_PROXY_HEADERS
        value: "true"
      - key: CFF_TRUSTED_CLIENT_IP_HEADER
        value: "x-forwarded-for"
      - key: CFF_MIN_PASSWORD_LENGTH
        value: "12"
      - key: CFF_MAX_REQUEST_BODY_BYTES
        value: "262144"
      - key: CFF_AUTH_REQUEST_BODY_BYTES
        value: "8192"

  - type: web
    name: college-ff-frontend
    runtime: static
    buildCommand: sh scripts/render-build-frontend.sh
    staticPublishPath: ./frontend-dist
    envVars:
      - key: CFF_API_BASE
        sync: false
      - key: CFF_ALLOW_LOCAL_DEMO
        value: "false"
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /config.js
        name: Cache-Control
        value: "no-store"
      - path: /*.html
        name: Cache-Control
        value: "no-store"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"

  - type: cron
    name: college-ff-cfbd-ingest
    runtime: python
    plan: starter
    schedule: "0 10 * * *"
    buildCommand: python -m py_compile scripts/ops_ingest.py
    startCommand: >-
      sh -c 'export CFF_API_BASE_URL="http://${CFF_API_HOSTPORT}";
      exec python scripts/ops_ingest.py --run'
    envVars:
      - key: CFF_API_HOSTPORT
        fromService:
          type: web
          name: college-ff-api
          property: hostport
      - key: CFF_ADMIN_API_TOKEN
        fromService:
          type: web
          name: college-ff-api
          envVarKey: CFF_ADMIN_API_TOKEN
      - key: CFF_INGEST_TIMEOUT_SECONDS
        value: "900"
      - key: CFF_INGEST_HEALTH_RETRIES
        value: "6"
      - key: CFF_INGEST_RETRY_DELAY_SECONDS
        value: "10"

  - type: cron
    name: college-ff-db-backup
    runtime: docker
    dockerfilePath: ./ops/backup/Dockerfile
    dockerContext: .
    schedule: "0 7 * * *"
    plan: starter
    envVars:
      - key: DB_URL
        fromDatabase:
          name: college-ff-db
          property: connectionString
      - key: CFF_BACKUP_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: auto
      - key: CFF_BACKUP_S3_PREFIX
        value: college-ff/postgres
      - key: CFF_BACKUP_RETENTION_DAYS
        value: "30"
      - key: CFF_BACKUP_SSE
        value: AES256

databases:
  - name: college-ff-db
    databaseName: college_ff
    user: college_ff
