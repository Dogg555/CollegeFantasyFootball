services:
  - type: web
    name: college-ff-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    preDeployCommand: sh /srv/db/migrate.sh
    envVars:
      - key: DB_URL
        fromDatabase:
          name: college-ff-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: CFF_ADMIN_API_TOKEN
        sync: false
      - key: CFF_ADMIN_EMAILS
        sync: false
      - key: CFBD_INGEST_ON_STARTUP
        value: "true"
      - key: CFBD_INGEST_INTERVAL_HOURS
        value: "24"
      - key: RESEND_API_KEY
        sync: false
      - key: CFF_EMAIL_FROM
        sync: false
      - key: CFF_FRONTEND_BASE_URL
        sync: false
      - key: CFF_REQUIRE_DB
        value: "true"
      - key: CFF_ALLOW_SHARED_SECRET_AUTH
        value: "false"
      - key: CFF_REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: CFF_EXPOSE_AUTH_TOKENS
        value: "false"
      - key: CFF_LOG_AUTH_TOKENS
        value: "false"

  - type: web
    name: college-ff-frontend
    runtime: static
    buildCommand: sh scripts/render-build-frontend.sh
    staticPublishPath: ./frontend-dist
    envVars:
      - key: CFF_API_BASE
        sync: false
      - key: CFF_ALLOW_LOCAL_DEMO
        value: "false"
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"

databases:
  - name: college-ff-db
    databaseName: college_ff
    user: college_ff
