services:
  - type: web
    name: college-ff-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    preDeployCommand: sh /srv/db/migrate.sh
    envVars:
      - key: DB_URL
        fromDatabase:
          name: college-ff-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: CFF_REQUIRE_DB
        value: "true"
      - key: CFF_ALLOW_SHARED_SECRET_AUTH
        value: "false"
      - key: CFF_REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: CFF_EXPOSE_AUTH_TOKENS
        value: "false"
      - key: CFF_LOG_AUTH_TOKENS
        value: "false"

databases:
  - name: college-ff-db
    databaseName: college_ff
    user: college_ff
