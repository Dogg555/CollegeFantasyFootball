services:
  postgres:
    image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:-cff}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-cff}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      - PORT=${PORT:-8080}
      - JWT_SECRET=${JWT_SECRET:?set in .env.local}
      - DB_URL=${DB_URL:?set in .env.local}
      - CFF_REQUIRE_DB=${CFF_REQUIRE_DB:-true}
      - CFF_RUN_MIGRATIONS_ON_STARTUP=true
      - ESPN_ROSTER_AUTO_ONCE=false
      # - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
